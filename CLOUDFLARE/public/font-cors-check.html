<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font CORS Check</title>
</head>
<body>
<h1>Font CORS Check</h1>
<pre id="result">RUNNING</pre>
<script>
(async()=>{
const paths=[
"/runtime/webfonts/6.7.2/fa-solid-900.woff2",
"/runtime/webfonts/6.7.2/fa-regular-400.woff2",
"/runtime/webfonts/6.7.2/fa-brands-400.woff2"
];
const results=await Promise.all(paths.map(async path=>{
try{
const response=await fetch(path+"?corscheck=20261123",{cache:"no-store"});
const bytes=new Uint8Array(await response.arrayBuffer());
return {path,status:response.status,acao:response.headers.get("access-control-allow-origin"),acaoCount:(response.headers.get("access-control-allow-origin")||"").split(",").length,contentType:response.headers.get("content-type"),corp:response.headers.get("cross-origin-resource-policy"),length:bytes.length,magic:[...bytes.slice(0,8)].map(v=>v.toString(16).padStart(2,"0")).join(""),ok:response.ok&&response.headers.get("access-control-allow-origin")==="*"&&bytes.length>0};
}catch(error){return {path,error:String(error&&error.message||error),ok:false}}
}));
document.getElementById("result").textContent=JSON.stringify({version:"20261123-fa-self-hosted-5",allOk:results.every(x=>x.ok),results},null,2);
})();
</script>
</body>
</html>
