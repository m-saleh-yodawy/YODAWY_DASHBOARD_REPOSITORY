<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Font Asset Health Check</title>
<style>body{font:14px system-ui,sans-serif;margin:24px;white-space:pre-wrap;overflow-wrap:anywhere}#status{font-family:monospace}</style>
<link rel="stylesheet" href="/runtime/fa-icons.css?v=20261123-fa-self-hosted-3">
</head>
<body>
<h1>Font Asset Health Check</h1>
<pre id="status">RUNNING</pre>
<script>
(async()=>{
const files=[
{name:"solid",path:"/runtime/webfonts/6.7.2/fa-solid-900.woff2",family:"YD Font Awesome 6 Free",weight:"900"},
{name:"regular",path:"/runtime/webfonts/6.7.2/fa-regular-400.woff2",family:"YD Font Awesome 6 Free",weight:"400"},
{name:"brands",path:"/runtime/webfonts/6.7.2/fa-brands-400.woff2",family:"YD Font Awesome 6 Brands",weight:"400"}
];
const results=await Promise.all(files.map(async file=>{
try{
const response=await fetch(file.path+"?probe=20261123",{cache:"no-store",credentials:"omit"});
const buffer=await response.arrayBuffer();
const bytes=new Uint8Array(buffer);
const face=new FontFace(file.family,"url("+file.path+"?probe=20261123)",{weight:file.weight});
await face.load();
document.fonts.add(face);
return {name:file.name,ok:response.ok,status:response.status,url:response.url,type:response.headers.get("content-type"),length:bytes.length,magic:[...bytes.slice(0,8)].map(value=>value.toString(16).padStart(2,"0")).join(""),fontFaceLoaded:face.status==="loaded"};
}catch(error){return {name:file.name,ok:false,error:String(error&&error.message||error)}}
}));
document.getElementById("status").textContent=JSON.stringify({version:"20261123-fa-self-hosted-3",time:new Date().toISOString(),results},null,2);
})();
</script>
</body>
</html>
