<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#875A7B">
<title>YODAWY Dashboard</title>
<link rel="stylesheet" href="/runtime/fa-icons.css">
<style>
:root{font-family:Nunito,Arial,sans-serif;color:#251d27;background:#f8f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:#875a7b;color:#fff;font-weight:700}button:disabled{opacity:.55;cursor:wait}.secondary{background:#eee7ed;color:#68465f}.danger{background:#b42336}.muted{color:#827783}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(100%,420px);padding:32px;background:#fff;border:1px solid #eee7ed;border-radius:18px;box-shadow:0 16px 48px #34223512}.brand{font-size:25px;font-weight:900;color:#68465f}.field{display:grid;gap:7px;margin:16px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd2dc;border-radius:9px;background:#fff;color:#251d27;outline-color:#875a7b}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#211b24;color:#f8f5f7;padding:22px 15px;display:flex;flex-direction:column;gap:8px}.sidebar .brand{color:#fff;padding:8px 10px 24px}.nav{width:100%;text-align:left;background:transparent;color:#d9cbd7;padding:12px}.nav.active,.nav:hover{background:#68465f;color:#fff}.side-user{margin-top:auto;padding:12px;color:#d9cbd7;font-size:13px;overflow-wrap:anywhere}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid #eee7ed;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.content{padding:28px;max-width:1400px;margin:auto}.page-title{font-size:25px;margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:22px 0}.card{background:#fff;border:1px solid #eee7ed;border-radius:13px;padding:18px;min-width:0}.metric{font-size:30px;font-weight:900;color:#68465f;margin-top:8px}.table-wrap{overflow:auto;background:#fff;border:1px solid #eee7ed;border-radius:12px;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #f0eaf0;font-size:14px}th{color:#68465f;background:#fbf9fb}tr:last-child td{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#eee7ed;color:#68465f;font-size:12px;font-weight:800}.tool-name-cell{display:inline-flex;align-items:center;gap:9px}.tool-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:#f4edf3;color:#875a7b;font-size:12px;flex:0 0 24px}.notice{padding:12px 14px;border-radius:9px;background:#f4edf3;color:#68465f;margin:12px 0}.error{background:#fff0f0;color:#a21d2d}.modal{position:fixed;inset:0;background:#17131a88;display:grid;place-items:center;padding:18px;z-index:5}.modal-card{width:min(100%,460px);background:#fff;border-radius:15px;padding:22px;max-height:90vh;overflow:auto}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:12px}.sidebar .brand,.side-user{grid-column:1/-1;padding:8px}.nav{text-align:center;padding:9px}.topbar{padding:0 16px}.content{padding:18px}}
</style>
</head>
<body>
<div id="login" class="login-wrap"><form id="login-form" class="login-card"><div class="brand">YODAWY Dashboard</div><p class="muted">Sign in to your workspace</p><div id="login-error" class="notice error hidden"></div><label class="field">User ID<input name="username" autocomplete="username" placeholder="Q-001" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label><button id="login-button" style="width:100%">Sign in</button></form></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand">YODAWY</div><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="tools">Tools</button><button class="nav" data-page="users">Users</button><button class="nav" data-page="announcements">Announcements</button><button class="nav" data-page="settings">Settings</button><div class="side-user" id="side-user"></div></aside><section class="main"><header class="topbar"><strong id="top-title">Overview</strong><button class="secondary" id="logout">Sign out</button></header><main class="content" id="view"></main></section></div>
<div id="modal" class="modal hidden"><form id="modal-form" class="modal-card"><h3 id="modal-title"></h3><div id="modal-fields"></div><div class="modal-actions"><button type="button" class="secondary" id="modal-cancel">Cancel</button><button id="modal-save">Save</button></div></form></div>
<script>
(()=>{'use strict';
const API='/api',state={access:'',refresh:'',user:null,data:null,page:'overview'};
const $=id=>document.getElementById(id),escapeHTML=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const request=async(path,options={})=>{const headers={'Content-Type':'application/json',...(options.headers||{})};if(state.access)headers.Authorization='Bearer '+state.access;let response=await fetch(API+path,{...options,headers});let data=await response.json().catch(()=>({}));if(response.status===401&&state.refresh&&path!=='/auth/refresh'){const renewed=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:state.refresh})});const next=await renewed.json().catch(()=>({}));if(next.success){state.access=next.accessToken;state.refresh=next.refreshToken;sessionStorage.setItem('yd_refresh',state.refresh);headers.Authorization='Bearer '+state.access;response=await fetch(API+path,{...options,headers});data=await response.json().catch(()=>({}));}else{logout();throw Error('SESSION_EXPIRED');}}if(!response.ok||data.success===false)throw Error(data.error||'REQUEST_FAILED');return data;};
const showError=(node,error)=>{node.textContent=error.message||'Something went wrong';node.classList.remove('hidden');};
const logout=async()=>{try{if(state.access)await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+state.access}})}catch{}state.access='';state.refresh='';state.user=null;sessionStorage.removeItem('yd_refresh');$('app').classList.add('hidden');$('login').classList.remove('hidden');};
const load=async()=>{const data=await request('/dashboard/bootstrap');state.data=data;state.user=data.user;render();};
const go=page=>{state.page=page;document.querySelectorAll('.nav').forEach(button=>button.classList.toggle('active',button.dataset.page===page));$('top-title').textContent=page[0].toUpperCase()+page.slice(1);render();};
const metric=(label,value)=>'<article class="card"><div class="muted">'+label+'</div><div class="metric">'+value+'</div></article>';
const table=(headers,rows)=>'<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
const render=()=>{const d=state.data||{},u=state.user||{};$('side-user').textContent=(u.name||'')+' · '+(u.id||'')+' · '+(u.role||'');let html='';
if(state.page==='overview'){html='<h1 class="page-title">Overview</h1><p class="muted">Workspace status and account summary</p><div class="grid">'+metric('Users',(d.users||[]).length)+metric('Available tools',(d.tools||[]).length)+metric('Announcements',(d.announcements||[]).length)+metric('Your role',escapeHTML(u.role||''))+'</div><div class="card"><h3>Cloud services</h3><div class="notice">Worker API connected · D1 data loaded successfully</div><span class="badge">'+escapeHTML(u.id||'')+'</span> <span class="badge">'+escapeHTML(u.role||'')+'</span></div>';}
if(state.page==='tools'){const rows=(d.tools||[]).map(t=>{const icon=String(t.icon||(t.id==='TOOL-019'?'fa-solid fa-camera':'')).trim();const iconHtml=icon?'<span class="tool-icon" aria-hidden="true"><i class="yd-fa-icon '+escapeHTML(icon)+'"></i></span>':'';return '<tr><td><span class="tool-name-cell">'+iconHtml+'<span>'+escapeHTML(t.name)+'</span></span></td><td>'+escapeHTML(t.id)+'</td><td>'+escapeHTML(t.version||'—')+'</td><td><span class="badge">'+(t.enabled?'Enabled':'Disabled')+'</span></td></tr>';}).join('')||'<tr><td colspan="4">No tools registered yet</td></tr>';html='<h1 class="page-title">Tools</h1><p class="muted">Tools currently registered in Cloudflare D1</p>'+table(['Tool','ID','Version','Status'],rows);}
if(state.page==='users'){if(!['ADMIN','SUPER_ADMIN'].includes(u.role)){html='<h1 class="page-title">Users</h1><div class="notice">You do not have permission to manage users.</div>';}else{const rows=(d.users||[]).map(x=>'<tr><td>'+escapeHTML(x.id)+'</td><td>'+escapeHTML(x.name)+'</td><td>'+escapeHTML(x.role)+'</td><td>'+escapeHTML(x.status)+'</td><td><div class="actions"><button class="secondary" data-edit-user="'+escapeHTML(x.id)+'">Edit</button><button class="danger" data-delete-user="'+escapeHTML(x.id)+'">Delete</button></div></td></tr>').join('')||'<tr><td colspan="5">No users found</td></tr>';html='<h1 class="page-title">Users</h1><div class="toolbar"><span class="muted">Manage workspace accounts</span><button id="add-user">Create user</button></div>'+table(['User ID','Name','Role','Status','Actions'],rows);}}
if(state.page==='announcements'){const rows=(d.announcements||[]).map(x=>'<tr><td>'+escapeHTML(x.author_name||x.author_id)+'</td><td>'+escapeHTML(x.body)+'</td><td>'+escapeHTML(x.created_at)+'</td><td>'+(['ADMIN','SUPER_ADMIN'].includes(u.role)?'<div class="actions"><button class="secondary" data-edit-ann="'+escapeHTML(x.id)+'">Edit</button><button class="danger" data-delete-ann="'+escapeHTML(x.id)+'">Delete</button></div>':'—')+'</td></tr>').join('')||'<tr><td colspan="4">No announcements yet</td></tr>';html='<h1 class="page-title">Announcements</h1>'+(['ADMIN','SUPER_ADMIN'].includes(u.role)?'<div class="toolbar"><span class="muted">Workspace messages</span><button id="add-ann">New announcement</button></div>':'')+table(['Author','Message','Created','Actions'],rows);}
if(state.page==='settings'){html='<h1 class="page-title">Settings</h1><div class="card"><h3>Account</h3><p><b>Name:</b> '+escapeHTML(u.name)+'</p><p><b>User ID:</b> '+escapeHTML(u.id)+'</p><p><b>Role:</b> '+escapeHTML(u.role)+'</p><button id="change-password">Change password</button></div>';}
$('view').innerHTML=html;};
const openModal=(title,fields,onSave)=>{$('modal-title').textContent=title;$('modal-fields').innerHTML=fields;$('modal').classList.remove('hidden');$('modal-form').onsubmit=async event=>{event.preventDefault();const button=$('modal-save');button.disabled=true;try{await onSave(new FormData(event.currentTarget));$('modal').classList.add('hidden');await load();}catch(error){let n=$('modal-error');if(!n){n=document.createElement('div');n.id='modal-error';n.className='notice error';$('modal-fields').prepend(n);}showError(n,error);}finally{button.disabled=false;}};};
$('modal-cancel').onclick=()=>$('modal').classList.add('hidden');
$('login-form').onsubmit=async event=>{event.preventDefault();const button=$('login-button');button.disabled=true;$('login-error').classList.add('hidden');const form=new FormData(event.currentTarget);try{const result=await request('/auth/login',{method:'POST',body:JSON.stringify({username:form.get('username'),password:form.get('password')})});state.access=result.accessToken;state.refresh=result.refreshToken;state.user=result.user;sessionStorage.setItem('yd_refresh',state.refresh);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();}catch(error){showError($('login-error'),error);}finally{button.disabled=false;}};
$('logout').onclick=logout;document.querySelectorAll('.nav').forEach(button=>button.onclick=()=>go(button.dataset.page));
$('view').addEventListener('click',async event=>{const target=event.target.closest('button');if(!target)return;try{
if(target.id==='add-user')openModal('Create user','<label class="field">Full name<input name="name" maxlength="100" required></label><label class="field">Role<select name="role"><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select></label>',async form=>{await request('/dashboard/users',{method:'POST',body:JSON.stringify({name:form.get('name'),role:form.get('role')})});});
if(target.dataset.editUser){const user=state.data.users.find(x=>x.id===target.dataset.editUser);openModal('Edit '+user.id,'<label class="field">Name<input name="name" value="'+escapeHTML(user.name)+'" required></label><label class="field">Role<select name="role"><option '+(user.role==='USER'?'selected':'')+'>USER</option><option '+(user.role==='ADMIN'?'selected':'')+'>ADMIN</option></select></label><label class="field">Status<select name="status"><option '+(user.status==='Active'?'selected':'')+'>Active</option><option '+(user.status==='Inactive'?'selected':'')+'>Inactive</option></select></label>',async form=>{await request('/dashboard/users/'+encodeURIComponent(user.id),{method:'PATCH',body:JSON.stringify({name:form.get('name'),role:form.get('role'),status:form.get('status')})});});}
if(target.dataset.deleteUser&&confirm('Delete '+target.dataset.deleteUser+'?')){await request('/dashboard/users/'+encodeURIComponent(target.dataset.deleteUser),{method:'DELETE'});await load();}
if(target.id==='add-ann')openModal('New announcement','<label class="field">Message<textarea name="body" rows="5" maxlength="10000" required></textarea></label>',async form=>{await request('/dashboard/announcements',{method:'POST',body:JSON.stringify({body:form.get('body')})});});
if(target.dataset.editAnn){const item=state.data.announcements.find(x=>x.id===target.dataset.editAnn);openModal('Edit announcement','<label class="field">Message<textarea name="body" rows="5" maxlength="10000" required>'+escapeHTML(item.body)+'</textarea></label>',async form=>{await request('/dashboard/announcements/'+encodeURIComponent(item.id),{method:'PATCH',body:JSON.stringify({body:form.get('body')})});});}
if(target.dataset.deleteAnn&&confirm('Delete this announcement?')){await request('/dashboard/announcements/'+encodeURIComponent(target.dataset.deleteAnn),{method:'DELETE'});await load();}
if(target.id==='change-password')openModal('Change password','<label class="field">Current password<input name="currentPassword" type="password" required></label><label class="field">New password<input name="newPassword" type="password"  required></label>',async form=>{await request('/auth/change-password',{method:'POST',body:JSON.stringify({currentPassword:form.get('currentPassword'),newPassword:form.get('newPassword')})});await logout();});
}catch(error){alert(error.message||'Request failed');}});
const restore=async()=>{const token=sessionStorage.getItem('yd_refresh');if(!token)return;try{const result=await request('/auth/refresh',{method:'POST',body:JSON.stringify({refreshToken:token})});state.access=result.accessToken;state.refresh=result.refreshToken;state.user=result.user;sessionStorage.setItem('yd_refresh',state.refresh);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();}catch{sessionStorage.removeItem('yd_refresh');}};
restore();
})();
</script>
</body>
</html>
