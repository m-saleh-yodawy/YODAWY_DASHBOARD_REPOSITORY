name: Sync Tools to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "TOOLS/**/*.js"
      - "TOOLS/*.js"
      - "TOOLS/manifest.json"
      - "CLOUDFLARE/src/**/*.js"
      - "CLOUDFLARE/src/*.js"
      - "CLOUDFLARE/migrations/*.sql"
      - "CLOUDFLARE/public/site-access.json"
      - "CLOUDFLARE/schema.sql"
      - "CLOUDFLARE/wrangler.jsonc"
      - ".github/workflows/sync-tools-to-cloudflare.yml"
      - "LEGACY/**/*.js"
      - "LEGACY/*.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yodawy-cloudflare-production
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e6a8f372ece7ccf9867091d9181934ea
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global wrangler@4
      - name: Validate tool syntax and lifecycle contracts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const root = path.resolve("TOOLS");
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "manifest.json"), "utf8"));
          const active = manifest.tools.filter(tool => tool.enabled !== false);
          const failures = [];

          if (!active.length) throw new Error("No enabled tools were found in TOOLS/manifest.json.");

          for (const tool of active) {
            const file = path.join(root, tool.file);
            if (!fs.existsSync(file)) {
              failures.push(tool.id + ": source file is missing: " + tool.file);
              continue;
            }

            const source = fs.readFileSync(file, "utf8");
            const lines = source.split(/\r?\n/).map(line => line.trim());
            const metadata = tag => {
              const line = lines.find(item => item.startsWith("// @" + tag + " "));
              return line ? line.slice(("// @" + tag).length).trim() : "";
            };
            const name = metadata("name");
            const version = metadata("version");
            const author = metadata("author");
            const matches = lines.filter(line => line.startsWith("// @match ")).map(line => line.slice(10).trim());
            const expectedFile = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".js";
            const registered = source.includes("registry[TOOL_ID]");
            const hasDestroy = source.includes("destroy(") || source.includes("destroy:");
            const syntax = spawnSync(process.execPath, ["--check", file], { encoding: "utf8" });

            if (name !== tool.name) failures.push(tool.id + ": @name does not match manifest.");
            if (version !== "1") failures.push(tool.id + ": @version must be 1.");
            if (author !== "Mohamed Saleh") failures.push(tool.id + ": @author must be Mohamed Saleh.");
            if (!matches.length || JSON.stringify(matches) !== JSON.stringify(tool.matches || [])) failures.push(tool.id + ": manifest match patterns do not match @match metadata.");
            if (!source.includes(tool.id) || !source.includes("TOOL_ID")) failures.push(tool.id + ": TOOL_ID does not match manifest.");
            if (!registered) failures.push(tool.id + ": instance is not registered in YODAWY_TOOL_INSTANCES.");
            if (!hasDestroy) failures.push(tool.id + ": destroy() is missing.");
            if (tool.file !== expectedFile) failures.push(tool.id + ": filename does not match @name.");
            if (syntax.status !== 0) failures.push(tool.id + ": JavaScript syntax check failed: " + (syntax.stderr || syntax.stdout).trim());
          }

          for (const file of [
            "CORE/tools-manager.js",
            "CORE/module-loader.js",
            "CLOUDFLARE/public/runtime/core-tools-manager.js",
            "CLOUDFLARE/public/runtime/core-module-loader.js"
          ]) {
            const syntax = spawnSync(process.execPath, ["--check", file], { encoding: "utf8" });
            if (syntax.status !== 0) failures.push(file + ": JavaScript syntax check failed: " + (syntax.stderr || syntax.stdout).trim());
          }

          if (failures.length) {
            for (const failure of failures) console.error("::error::" + failure);
            process.exit(1);
          }
          console.log("Validated " + active.length + " active tools and core lifecycle modules: syntax, identity, host match, version, author, registry, and destroy().");
          NODE
      - name: Build tool manifest, Cloudflare assets, and D1 registry
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_D1_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_D1_API_TOKEN is missing or needs Account D1 Edit permission."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");

          const sourceDir = path.resolve("TOOLS");
          const legacyDir = path.resolve("LEGACY");
          const assetsDir = path.resolve("CLOUDFLARE/public/tools");
          const sqlPath = path.resolve("CLOUDFLARE/sync-tools.sql");
          const manifestPath = path.join(sourceDir, "manifest.json");
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const tools = Array.isArray(manifest.tools) ? manifest.tools : [];
          const byFile = new Map(tools.map(tool => [tool.file, tool]));
          const files = fs.readdirSync(sourceDir).filter(file => file.endsWith(".js") && !/^(test-|.*\.(test|spec))/i.test(file) && !/^BACKUP-SPLIT-/i.test(file)).sort();

          if (!files.length) throw new Error("No official JavaScript tools were found in TOOLS.");

          let nextId = tools.reduce((max, tool) => Math.max(max, Number(String(tool.id).match(/TOOL-(\d+)/)?.[1] || 0)), 0) + 1;
          fs.mkdirSync(assetsDir, { recursive: true });

          const active = files.map(file => {
            const sourcePath = path.join(sourceDir, file);
            const content = fs.readFileSync(sourcePath, "utf8");
            const name = content.match(/^\s*\/\/\s*@name\s+(.+)$/m)?.[1]?.trim() || path.basename(file, ".js");
            const description = content.match(/^\s*\/\/\s*@description\s+(.+)$/m)?.[1]?.trim();
            const matches = [...content.matchAll(/^\s*\/\/\s*@match\s+(.+)$/gm)].map(match => match[1].trim());
            if (!matches.length) throw new Error(file + " must declare at least one @match host pattern.");
            let tool = byFile.get(file);

            if (!tool) {
              tool = { id: "TOOL-" + String(nextId++).padStart(3, "0"), file, name, description: description || "", enabled: true };
              tools.push(tool);
              byFile.set(file, tool);
            }

            tool.name = name;
            if (description) tool.description = description;
            tool.matches = matches;
            tool.enabled = true;
            delete tool.version;

            const version = content.match(/^\s*\/\/\s*@version\s+(.+)$/m)?.[1]?.trim();
            if (version && version !== "1") throw new Error(file + " must use @version 1.");

            const expectedFile = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".js";
            if (file !== expectedFile) throw new Error(file + " must match its @name: " + expectedFile);
            if (/\b(?:odoo|portal)\b/i.test(name)) throw new Error(file + " must not include platform names.");

            tool.sha256 = crypto.createHash("sha256").update(content, "utf8").digest("hex");
            fs.copyFileSync(sourcePath, path.join(assetsDir, file));
            return tool;
          });

          const activeFiles = new Set(files);
          const legacyFile = "portal-tool-old.js";
          const legacyPath = path.join(legacyDir, legacyFile);
          let legacySha256 = null;

          if (fs.existsSync(legacyPath)) {
            const legacyContent = fs.readFileSync(legacyPath, "utf8");
            legacySha256 = crypto.createHash("sha256").update(legacyContent, "utf8").digest("hex");
            fs.copyFileSync(legacyPath, path.join(assetsDir, legacyFile));
          }

          for (const tool of tools) {
            if (!activeFiles.has(tool.file)) tool.enabled = false;
          }

          const preservedAssets = new Set([...activeFiles, legacyFile]);
          for (const file of fs.readdirSync(assetsDir)) {
            if (file.endsWith(".js") && !preservedAssets.has(file)) fs.unlinkSync(path.join(assetsDir, file));
          }

          delete manifest.version;
          for (const tool of tools) delete tool.version;
          manifest.tools = tools.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");

          const quote = value => "'" + String(value ?? "").replace(/'/g, "''") + "'";
          const statements = active.map(tool =>
            "INSERT INTO tools (tool_id, name, description, version, asset_path, sha256, enabled, match_patterns) VALUES (" +
            [tool.id, tool.name, tool.description, "1", "TOOLS/" + tool.file, tool.sha256, 1, JSON.stringify(tool.matches)].map(quote).join(", ") +
            ") ON CONFLICT(tool_id) DO UPDATE SET name=excluded.name, description=excluded.description, version=excluded.version, asset_path=excluded.asset_path, sha256=excluded.sha256, enabled=1, match_patterns=excluded.match_patterns, updated_at=CURRENT_TIMESTAMP;"
          );

          if (legacySha256) statements.push("UPDATE tools SET sha256=" + quote(legacySha256) + ", updated_at=CURRENT_TIMESTAMP WHERE tool_id=" + quote("TOOL-017") + ";");

          for (const tool of tools.filter(item => !item.enabled)) {
            statements.push("UPDATE tools SET enabled=0, updated_at=CURRENT_TIMESTAMP WHERE tool_id=" + quote(tool.id) + ";");
          }

          for (const tool of active) {
            statements.push("INSERT OR IGNORE INTO tool_visibility (tool_id, mode, updated_at) VALUES (" + quote(tool.id) + ", 'PRIVATE', CURRENT_TIMESTAMP);");
          }

          fs.writeFileSync(sqlPath, statements.join("\n") + "\n");
          NODE
      - name: Apply D1 migrations
        working-directory: CLOUDFLARE
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_D1_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_D1_API_TOKEN is missing or needs Account D1 Edit permission."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN"
          wrangler d1 migrations apply yodawy-dashboard --remote --config wrangler.jsonc
      - name: Synchronize D1 tool registry
        working-directory: CLOUDFLARE
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN"
          wrangler d1 execute yodawy-dashboard --remote --file=sync-tools.sql --config wrangler.jsonc
      - name: Deploy updated Worker assets
        working-directory: CLOUDFLARE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e6a8f372ece7ccf9867091d9181934ea
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
          wrangler deploy --config wrangler.jsonc
      - name: Remove generated SQL and commit synchronized files
        run: |
          set -euo pipefail
          rm -f CLOUDFLARE/sync-tools.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TOOLS/manifest.json CLOUDFLARE/public/tools
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync official tools and Cloudflare assets [skip ci]"
          for ATTEMPT in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
