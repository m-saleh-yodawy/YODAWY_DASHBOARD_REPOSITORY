name: DASHBOARD - PERSONAL WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/dashboard-personal-request-*.json"
  workflow_dispatch:
    inputs:
      sequence:
        description: "Sequence number"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-personal-comm
  cancel-in-progress: false

jobs:
  send-personal-request:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER: m-saleh-yodawy
      SOURCE_REPO: YODAWY_DASHBOARD_REPOSITORY
      USERS_REPO: YODAWY_USERS_REPOSITORY
      BRANCH: main
      INPUT_SEQ: ${{ inputs.sequence || '' }}
      SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}

    steps:
      - name: Validate Target Repository, Verify Tool Permission, Send Personal Request, and Relay Response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import copy
          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from datetime import datetime, timezone

          OWNER = os.environ["OWNER"]
          SOURCE_REPO = os.environ["SOURCE_REPO"]
          USERS_REPO = os.environ["USERS_REPO"]
          BRANCH = os.environ["BRANCH"]
          INPUT_SEQ = os.environ.get("INPUT_SEQ", "").strip()
          TOKEN = os.environ.get("SYNC_TOKEN", "").strip()
          API = "https://api.github.com"
          MAX_REQUESTS = 50
          ACTIVE_STATES = {"SENT", "RECEIVED", "PROCESSING", "PROCESSED", "RESPONSE_SENT"}

          LOGS_PATH = "NETWORK/network-logs.json"
          USERS_PATH = "CONFIG/users.json"
          LEGACY_USERS_PATH = "CONFIG/auth-users.json"
          PERMISSIONS_PATH = "CONFIG/tools-permissions.json"

          PROTECTED_REPOS = {
              "yodawy_dashboard_repository",
              "yodawy_users_repository",
              "yodawy_tools_repository",
              "yodawy_template_repository",
          }
          ALLOWED_SETTINGS_KEYS = {"displayName", "startPage", "dashboardOpen", "tools"}
          ALLOWED_REQUEST_TYPES = {
              "DASHBOARD_PERSONAL_SYNC",
              "UPDATE_DASHBOARD_SETTINGS",
              "UPDATE_SETTINGS",
              "TOGGLE_PERSONAL_TOOL",
          }

          if not TOKEN:
              raise RuntimeError("Missing YODAWY_REPOSITORIES_SYNC_TOKEN")

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "Yodawy-Dashboard-Personal",
          }

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def default_logs():
              return {"protocolVersion": 1, "updatedAt": utc_now(), "transactions": {}}

          def api_req(method, endpoint, body=None, allow_404=False):
              data = json.dumps(body, ensure_ascii=False).encode("utf-8") if body is not None else None
              for attempt in range(1, 6):
                  req = urllib.request.Request(API + endpoint, data=data, headers=HEADERS, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          raw = resp.read().decode("utf-8")
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as err:
                      if allow_404 and err.code == 404:
                          return None
                      detail = err.read().decode("utf-8", errors="replace")
                      if err.code in {429, 500, 502, 503, 504} and attempt < 5:
                          time.sleep(attempt * 2 + random.uniform(0.1, 1.0))
                          continue
                      raise RuntimeError(f"HTTP {err.code} on {method} {endpoint}: {detail}") from err
                  except urllib.error.URLError as err:
                      if attempt < 5:
                          time.sleep(attempt * 2)
                          continue
                      raise RuntimeError(f"Network error on {endpoint}: {err}") from err

          def read_json(repo, path, default=None):
              url = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}?ref={BRANCH}"
              res = api_req("GET", url, allow_404=True)
              if not res or not isinstance(res.get("content"), str):
                  return copy.deepcopy(default), None
              raw = base64.b64decode(res["content"]).decode("utf-8-sig").strip()
              if not raw:
                  return copy.deepcopy(default), res.get("sha")
              parsed = json.loads(raw)
              return (parsed if isinstance(parsed, dict) else copy.deepcopy(default)), res.get("sha")

          def write_json(repo, path, data, msg, create_only=False):
              if not isinstance(data, dict) or not data:
                  raise ValueError(f"Refusing to write invalid JSON to {repo}/{path}")
              content = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 7):
                  cur, sha = read_json(repo, path)
                  if create_only and sha is not None:
                      if isinstance(cur, dict) and cur.get("requestId") == data.get("requestId"):
                          return
                      raise RuntimeError("HTTP 422: File already exists")
                  if cur == data and sha is not None:
                      return
                  payload = {"message": f"{msg} [skip ci]", "content": encoded, "branch": BRANCH}
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", endpoint, payload)
                      return
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def cleanup_file(repo, path, req_id, msg):
              if path == LOGS_PATH or path.startswith("NETWORK/FAILED/"):
                  return "SKIPPED_PROTECTED"
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 5):
                  doc, sha = read_json(repo, path)
                  if not sha:
                      return "ALREADY_DELETED"
                  if req_id and isinstance(doc, dict):
                      file_req_id = str(doc.get("requestId") or "").strip()
                      if file_req_id and file_req_id != req_id:
                          return "SKIPPED_OTHER_TRANSACTION"
                  try:
                      api_req("DELETE", endpoint, {"message": f"{msg} [skip ci]", "sha": sha, "branch": BRANCH})
                      return "DELETED"
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 4:
                          time.sleep(attempt * 1.5)
                          continue
                      if "HTTP 404" in str(err):
                          return "ALREADY_DELETED"
                      return "API_FAILURE"
              return "API_FAILURE"

          def mutate_json(repo, path, default, mutator, msg):
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 7):
                  cur, sha = read_json(repo, path, default)
                  if not isinstance(cur, dict):
                      cur = copy.deepcopy(default)
                  updated = mutator(copy.deepcopy(cur))
                  if updated == cur and sha is not None:
                      return updated
                  content = json.dumps(updated, ensure_ascii=False, indent=2) + "\n"
                  payload = {
                      "message": f"{msg} [skip ci]",
                      "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                      "branch": BRANCH,
                  }
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", endpoint, payload)
                      return updated
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def list_network_files(repo):
              res = api_req("GET", f"/repos/{OWNER}/{repo}/contents/NETWORK?ref={BRANCH}", allow_404=True)
              return sorted(str(i.get("name", "")) for i in res if isinstance(i, dict)) if isinstance(res, list) else []

          def norm_id(val):
              return str(val or "").strip().upper()

          def norm_role(val):
              r = re.sub(r"[\s_-]+", "_", str(val or "USER").strip().upper())
              r = "SUPER_ADMIN" if r == "SUPERADMIN" else r
              return r if r in {"SUPER_ADMIN", "ADMIN", "USER", "SYSTEM", "UNKNOWN"} else "USER"

          def compact_logs(doc):
              txs = copy.deepcopy(doc.get("transactions")) if isinstance(doc.get("transactions"), dict) else {}
              active, terminal = {}, []
              for k, v in txs.items():
                  if not isinstance(v, dict):
                      continue
                  rid = str(v.get("requestId") or k).strip()
                  if not rid:
                      continue
                  st = str(v.get("status") or "COMPLETED").strip().upper()
                  c_at = str(v.get("createdAt") or v.get("updatedAt") or utc_now()).strip()
                  u_at = str(v.get("updatedAt") or v.get("completedAt") or v.get("sentAt") or c_at).strip()
                  actor_raw = v.get("actor")
                  actor_id = str(v.get("actorId") or (actor_raw.get("id") if isinstance(actor_raw, dict) else "UNKNOWN") or "UNKNOWN").strip().upper()
                  rec = {
                      "requestId": rid,
                      "sequence": str(v.get("sequence") or "001").strip(),
                      "requestType": str(v.get("requestType") or "DASHBOARD_PERSONAL_SYNC").strip(),
                      "action": str(v.get("action") or "UPDATE_DASHBOARD_SETTINGS").strip().upper(),
                      "status": st,
                      "actorId": actor_id,
                      "createdAt": c_at,
                      "updatedAt": u_at,
                  }
                  for opt in ("parentRequestId", "targetId", "error", "cleanup"):
                      val = v.get(opt) or (v.get("lastError") if opt == "error" else (v.get("targetUserId") if opt == "targetId" else None))
                      if val:
                          rec[opt] = str(val).strip()
                  if st in ACTIVE_STATES:
                      active[rid] = rec
                  else:
                      terminal.append((u_at, rid, rec))
              terminal.sort(key=lambda x: (x[0], x[1]))
              kept = {**active, **{rid: rec for _, rid, rec in terminal[-MAX_REQUESTS:]}}
              prev_txs = doc.get("transactions") if isinstance(doc.get("transactions"), dict) else {}
              u_ts = doc.get("updatedAt") if (prev_txs == kept and doc.get("updatedAt") and "auditLogs" not in doc) else utc_now()
              return {"protocolVersion": 1, "updatedAt": u_ts, "transactions": kept}

          def load_authoritative_users_and_perms():
              mapping = {}
              users_by_id = {}
              users_canon, _ = read_json(USERS_REPO, USERS_PATH, {"users": []})
              dash_users, _ = read_json(SOURCE_REPO, USERS_PATH, {"users": []})
              legacy_users, _ = read_json(SOURCE_REPO, LEGACY_USERS_PATH, {"users": []})
              users_reg, _ = read_json(USERS_REPO, "CONFIG/users-registry.json", {"users": []})
              for source_list in ((users_canon or {}).get("users", []), (dash_users or {}).get("users", []), (legacy_users or {}).get("users", []), (users_reg or {}).get("users", [])):
                  if isinstance(source_list, list):
                      for u in source_list:
                          if isinstance(u, dict) and norm_id(u.get("id")) and not u.get("archived", False):
                              uid = norm_id(u["id"])
                              users_by_id.setdefault(uid, u)
                              if u.get("repository"):
                                  mapping.setdefault(uid, str(u["repository"]).strip())
              u_perms, _ = read_json(USERS_REPO, PERMISSIONS_PATH, {})
              d_perms, _ = read_json(SOURCE_REPO, PERMISSIONS_PATH, {})
              merged_perms = copy.deepcopy(d_perms) if isinstance(d_perms, dict) else {}
              if isinstance(u_perms, dict):
                  for uid, u_map in u_perms.items():
                      if isinstance(u_map, dict):
                          merged_perms[norm_id(uid)] = copy.deepcopy(u_map)
              return mapping, users_by_id, merged_perms

          def is_tool_permitted_for_user(uid, tid, users_by_id, perms_by_user):
              u_meta = users_by_id.get(uid, {})
              u_role = norm_role(u_meta.get("role") or u_meta.get("ROLE") or "USER")
              u_map = perms_by_user.get(uid) if isinstance(perms_by_user.get(uid), dict) else {}
              t_entry = u_map.get(tid)
              if isinstance(t_entry, dict):
                  return bool(t_entry.get("granted", u_role == "SUPER_ADMIN"))
              if isinstance(t_entry, bool):
                  return t_entry
              return u_role == "SUPER_ADMIN"

          def get_permitted_tool_ids_for_user(uid, users_by_id, perms_by_user):
              u_meta = users_by_id.get(uid, {})
              u_role = norm_role(u_meta.get("role") or u_meta.get("ROLE") or "USER")
              u_map = perms_by_user.get(uid) if isinstance(perms_by_user.get(uid), dict) else {}
              return sorted(
                  [tid for tid, tv in u_map.items() if (isinstance(tv, dict) and bool(tv.get("granted", u_role == "SUPER_ADMIN"))) or (isinstance(tv, bool) and tv)],
                  key=lambda x: int(x.split("-")[1]) if re.fullmatch(r"TOOL-\d{3,}", str(x)) else 0,
              )

          def reject_personal_request(request_id, source_path, actor_id, canon_action, err_msg):
              ts_rej = utc_now()
              write_json(SOURCE_REPO, f"NETWORK/FAILED/{request_id}.json", {
                  "protocolVersion": 1,
                  "requestId": request_id,
                  "status": "REJECTED",
                  "actorId": actor_id,
                  "error": err_msg,
                  "failedAt": ts_rej,
              }, f"Reject personal request {request_id}")

              def _rec_rej(doc):
                  doc.setdefault("transactions", {})[request_id] = {
                      "requestId": request_id,
                      "sequence": "001",
                      "requestType": "DASHBOARD_PERSONAL_SYNC",
                      "action": canon_action,
                      "status": "REJECTED",
                      "actorId": actor_id,
                      "createdAt": ts_rej,
                      "updatedAt": ts_rej,
                      "error": err_msg,
                  }
                  return compact_logs(doc)

              mutate_json(SOURCE_REPO, LOGS_PATH, default_logs(), _rec_rej, f"Log rejected personal request {request_id}")
              cleanup_file(SOURCE_REPO, source_path, request_id, f"Remove rejected personal request {request_id}")

          user_repo_map, users_by_id, perms_by_user = load_authoritative_users_and_perms()
          repo_user_map = {v.casefold(): k for k, v in user_repo_map.items()}

          source_files = list_network_files(SOURCE_REPO)
          candidates = []
          if INPUT_SEQ and re.fullmatch(r"\d{3,}", INPUT_SEQ):
              p = f"NETWORK/dashboard-personal-request-{INPUT_SEQ}.json"
              if p.split("/")[1] in source_files:
                  candidates.append(p)
          for n in source_files:
              if re.fullmatch(r"dashboard-personal-request-\d{3,}\.json", n):
                  p = f"NETWORK/{n}"
                  if p not in candidates:
                      candidates.append(p)

          relayed_any = False

          for source_path in candidates:
              raw_data, _ = read_json(SOURCE_REPO, source_path)
              if not isinstance(raw_data, dict) or not raw_data:
                  continue

              request_id = str(raw_data.get("requestId") or "").strip()
              if not request_id:
                  request_id = f"DASH-PERS-{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}-{uuid.uuid4().hex[:8].upper()}"

              logs_state, _ = read_json(SOURCE_REPO, LOGS_PATH, default_logs())
              if (logs_state.get("transactions") or {}).get(request_id, {}).get("status") == "COMPLETED":
                  cleanup_file(SOURCE_REPO, source_path, request_id, f"Cleanup completed personal request {request_id}")
                  continue

              req_type = str(raw_data.get("requestType") or raw_data.get("action") or "DASHBOARD_PERSONAL_SYNC").strip().upper()
              if req_type not in ALLOWED_REQUEST_TYPES:
                  reject_personal_request(request_id, source_path, "UNKNOWN", "UPDATE_DASHBOARD_SETTINGS", f"Unsupported requestType: {req_type}")
                  raise RuntimeError(f"Unsupported requestType: {req_type}")

              payload = raw_data.get("payload") if isinstance(raw_data.get("payload"), dict) else {}
              dest = raw_data.get("destination") if isinstance(raw_data.get("destination"), dict) else {}
              dest_owner = str(dest.get("owner") or OWNER).strip()
              if dest_owner.casefold() != OWNER.casefold():
                  raise RuntimeError(f"Unauthorized destination owner: {dest_owner}")

              target_repo = str(dest.get("repository") or raw_data.get("repository") or payload.get("repository") or "").strip()
              if "/" in target_repo:
                  target_repo = target_repo.rsplit("/", 1)[-1]

              user_id = norm_id(raw_data.get("userId") or payload.get("userId"))
              if not target_repo and user_id:
                  target_repo = user_repo_map.get(user_id, "")
              if not user_id and target_repo:
                  user_id = repo_user_map.get(target_repo.casefold(), "")

              expected_repo = user_repo_map.get(user_id, "")
              if (
                  not target_repo
                  or not user_id
                  or target_repo.casefold() in PROTECTED_REPOS
                  or not re.fullmatch(r"Q-\d{3,}_[A-Z0-9_]+", target_repo)
                  or not expected_repo
                  or expected_repo.casefold() != target_repo.casefold()
              ):
                  reject_personal_request(request_id, source_path, user_id or "UNKNOWN", "UPDATE_DASHBOARD_SETTINGS", f"Destination validation failed for {user_id}/{target_repo}")
                  raise RuntimeError(f"Invalid target personal repository: {target_repo}")

              raw_actor = raw_data.get("actor") if isinstance(raw_data.get("actor"), dict) else {}
              claimed_actor_id = norm_id(raw_actor.get("id") or raw_actor.get("userId") or user_id)
              actor_meta = users_by_id.get(claimed_actor_id)
              if not actor_meta or str(actor_meta.get("status", "Active")).strip().casefold() != "active":
                  reject_personal_request(request_id, source_path, claimed_actor_id or "UNKNOWN", "UPDATE_DASHBOARD_SETTINGS", f"Unverified or inactive initiating user: {claimed_actor_id}")
                  raise RuntimeError(f"Unverified or inactive initiating user: {claimed_actor_id}")

              actor_role = norm_role(actor_meta.get("role") or actor_meta.get("ROLE") or "USER")
              is_toggle_op = req_type == "TOGGLE_PERSONAL_TOOL" or payload.get("action") == "TOGGLE_PERSONAL_TOOL"

              if is_toggle_op:
                  if claimed_actor_id != user_id and actor_role not in {"SUPER_ADMIN", "ADMIN"}:
                      reject_personal_request(request_id, source_path, claimed_actor_id, "TOGGLE_PERSONAL_TOOL", f"Actor {claimed_actor_id} cannot toggle tools for {user_id}")
                      raise RuntimeError(f"Actor {claimed_actor_id} is not authorized to toggle tools for {user_id}")
              else:
                  if claimed_actor_id != user_id and actor_role != "SUPER_ADMIN":
                      reject_personal_request(request_id, source_path, claimed_actor_id, "UPDATE_DASHBOARD_SETTINGS", f"Actor {claimed_actor_id} is not authorized to modify settings of {user_id}")
                      raise RuntimeError(f"Actor {claimed_actor_id} is not authorized to modify settings of {user_id}")

              actor_obj = {
                  "id": claimed_actor_id,
                  "userId": claimed_actor_id,
                  "name": str(actor_meta.get("name") or claimed_actor_id).strip(),
                  "username": str(actor_meta.get("name") or claimed_actor_id).strip(),
                  "role": actor_role,
                  "roleAtTimeOfAction": actor_role,
                  "verified": True,
              }

              permitted_ids = get_permitted_tool_ids_for_user(user_id, users_by_id, perms_by_user)

              if is_toggle_op:
                  tool_id = str(payload.get("toolId") or raw_data.get("toolId") or "").strip().upper()
                  enabled = payload.get("enabled") if "enabled" in payload else raw_data.get("enabled")
                  if not re.fullmatch(r"TOOL-\d{3,}", tool_id) or not isinstance(enabled, bool):
                      reject_personal_request(request_id, source_path, claimed_actor_id, "TOGGLE_PERSONAL_TOOL", "TOGGLE_PERSONAL_TOOL requires valid toolId and boolean enabled")
                      raise RuntimeError("TOGGLE_PERSONAL_TOOL requires valid toolId and boolean enabled")
                  if not is_tool_permitted_for_user(user_id, tool_id, users_by_id, perms_by_user):
                      err_perm = f"Rejected tool toggle: user {user_id} does not have permission for {tool_id}."
                      reject_personal_request(request_id, source_path, claimed_actor_id, "TOGGLE_PERSONAL_TOOL", err_perm)
                      raise RuntimeError(err_perm)
                  normalized_payload = {
                      "action": "TOGGLE_PERSONAL_TOOL",
                      "userId": user_id,
                      "toolId": tool_id,
                      "enabled": enabled,
                      "permittedToolIds": permitted_ids,
                  }
                  canon_action = "TOGGLE_PERSONAL_TOOL"
              else:
                  settings_updates = copy.deepcopy(payload.get("settings")) if isinstance(payload.get("settings"), dict) else {}
                  if not settings_updates:
                      for k in ALLOWED_SETTINGS_KEYS:
                          if k in payload:
                              settings_updates[k] = payload[k]
                          elif k in raw_data:
                              settings_updates[k] = raw_data[k]
                  invalid = [k for k in settings_updates if k not in ALLOWED_SETTINGS_KEYS]
                  if invalid or not settings_updates:
                      reject_personal_request(request_id, source_path, claimed_actor_id, "UPDATE_DASHBOARD_SETTINGS", f"Invalid or empty settings updates: {invalid}")
                      raise RuntimeError(f"Invalid or empty settings updates: {invalid}")
                  if isinstance(settings_updates.get("tools"), dict):
                      for tid_k in settings_updates["tools"].keys():
                          tid_norm = str(tid_k).strip().upper()
                          if not is_tool_permitted_for_user(user_id, tid_norm, users_by_id, perms_by_user):
                              err_perm = f"Rejected tool toggle in settings: user {user_id} does not have permission for {tid_norm}."
                              reject_personal_request(request_id, source_path, claimed_actor_id, "UPDATE_DASHBOARD_SETTINGS", err_perm)
                              raise RuntimeError(err_perm)
                  normalized_payload = {
                      "action": "UPDATE_DASHBOARD_SETTINGS",
                      "userId": user_id,
                      "settings": settings_updates,
                      "permittedToolIds": permitted_ids,
                  }
                  canon_action = "UPDATE_DASHBOARD_SETTINGS"

              seq_m = re.search(r"-(\d{3,})\.json$", source_path)
              names_union = set(list_network_files(SOURCE_REPO)) | set(list_network_files(target_repo))
              max_s = 0
              for n in names_union:
                  m = re.match(r"^dashboard-personal-request-(\d{3,})\.json$", n)
                  if m:
                      max_s = max(max_s, int(m.group(1)))
              pref_seq = int(seq_m.group(1)) if seq_m else (max_s + 1)

              seq = None
              ch_req_path = None
              request_obj = None

              for offset in range(25):
                  cand_seq = f"{pref_seq + offset:03d}"
                  cand_path = f"NETWORK/dashboard-personal-request-{cand_seq}.json"
                  existing_t, _ = read_json(target_repo, cand_path)
                  if isinstance(existing_t, dict) and existing_t and existing_t.get("requestId") != request_id:
                      continue
                  ts = utc_now()
                  cand_obj = {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "transactionId": request_id,
                      "sequence": cand_seq,
                      "requestType": "DASHBOARD_PERSONAL_SYNC",
                      "action": canon_action,
                      "status": "SENT",
                      "createdAt": raw_data.get("createdAt") or ts,
                      "sentAt": ts,
                      "actor": actor_obj,
                      "source": {"owner": OWNER, "repository": SOURCE_REPO, "branch": BRANCH},
                      "destination": {"owner": OWNER, "repository": target_repo, "branch": BRANCH},
                      "userId": user_id,
                      "requestPath": cand_path,
                      "payload": normalized_payload,
                  }
                  try:
                      write_json(target_repo, cand_path, cand_obj, f"Deliver personal request {request_id}", create_only=not existing_t)
                      seq = cand_seq
                      ch_req_path = cand_path
                      request_obj = cand_obj
                      break
                  except RuntimeError as err:
                      if "HTTP 422" in str(err) or "HTTP 409" in str(err):
                          continue
                      raise

              if not seq:
                  raise RuntimeError(f"Failed to allocate sequence for personal request {request_id}")

              write_json(SOURCE_REPO, ch_req_path, request_obj, f"Record personal request {request_id}")
              if source_path != ch_req_path:
                  cleanup_file(SOURCE_REPO, source_path, request_id, f"Remove unallocated request {request_id}")

              def _rec_sent(doc):
                  ts_s = utc_now()
                  tx = doc.setdefault("transactions", {}).setdefault(request_id, {"createdAt": ts_s})
                  tx.update({
                      "requestId": request_id,
                      "sequence": seq,
                      "requestType": "DASHBOARD_PERSONAL_SYNC",
                      "action": canon_action,
                      "actorId": claimed_actor_id,
                      "targetId": user_id,
                      "status": "SENT",
                      "updatedAt": ts_s,
                  })
                  return compact_logs(doc)

              mutate_json(SOURCE_REPO, LOGS_PATH, default_logs(), _rec_sent, f"Record sent personal request {request_id}")
              api_req("POST", f"/repos/{OWNER}/{target_repo}/actions/workflows/personal.yml/dispatches", {"ref": BRANCH})

              target_resp_path = f"NETWORK/personal-dashboard-response-{seq}.json"
              target_rec_path = f"NETWORK/dashboard-personal-receipt-{seq}.json"
              deadline = time.monotonic() + 300
              response_data = None
              while time.monotonic() < deadline:
                  resp, _ = read_json(target_repo, target_resp_path)
                  if (
                      isinstance(resp, dict)
                      and int(resp.get("protocolVersion", 1)) == 1
                      and resp.get("requestId") == request_id
                      and str(resp.get("sequence") or seq).strip() == seq
                  ):
                      response_data = resp
                      break
                  time.sleep(5)

              if not response_data:
                  write_json(SOURCE_REPO, f"NETWORK/FAILED/{request_id}.json", {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "sequence": seq,
                      "status": "FAILED",
                      "error": "Personal response timeout",
                      "failedAt": utc_now(),
                  }, f"Preserve timed out personal request {request_id}")
                  raise RuntimeError(f"Timed out waiting for response from {target_repo} for {request_id}")

              write_json(SOURCE_REPO, target_resp_path, response_data, f"Relay personal response {request_id}")

              cleanup_file(target_repo, ch_req_path, request_id, f"Cleanup personal request {request_id}")
              cleanup_file(target_repo, target_rec_path, request_id, f"Cleanup personal receipt {request_id}")
              cleanup_file(target_repo, target_resp_path, request_id, f"Cleanup personal response {request_id}")
              relayed_any = True

          if relayed_any:
              api_req("POST", f"/repos/{OWNER}/{SOURCE_REPO}/dispatches", {
                  "event_type": "dashboard_response_received",
                  "client_payload": {"source": "dashboard-personal"},
              })
          PY
