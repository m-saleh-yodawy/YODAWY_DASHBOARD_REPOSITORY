name: DASHBOARD - USERS WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/user-request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-users-sync-main
  cancel-in-progress: false

jobs:
  sync-dashboard-to-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_DASHBOARD_REPOSITORY
          ref: main
          persist-credentials: true

      - name: Validate Request Payload
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path

          req_file = Path("NETWORK/user-request.json")
          if not req_file.is_file():
              raise SystemExit(1)

          content = req_file.read_text(encoding="utf-8-sig").strip()
          if not content:
              raise SystemExit(1)

          data = json.loads(content)
          if not isinstance(data, dict):
              raise SystemExit(1)

          req_id = str(data.get("request_id") or "").strip()
          if not req_id:
              req_id = f"req_{uuid.uuid4().hex[:10]}"
              data["request_id"] = req_id

          name = str(data.get("name") or "").strip()
          role = str(data.get("ROLE") or data.get("role") or "").strip().upper()
          status = str(data.get("status") or "Active").strip()
          developer = bool(data.get("developer", False))

          if not name or role not in {"SUPER_ADMIN", "ADMIN", "USER"}:
              raise SystemExit(1)

          data["ROLE"] = role
          data["status"] = status
          data["developer"] = developer

          req_file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"request_id={req_id}\n")
          PY

      - name: Checkout Users Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_USERS_REPOSITORY
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          ref: main
          path: users
          persist-credentials: true

      - name: Transfer Request File
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p users/NETWORK
          cp NETWORK/user-request.json users/NETWORK/user-request.json
          cmp -s NETWORK/user-request.json users/NETWORK/user-request.json || exit 1

      - name: Push to Users Repository
        working-directory: users
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NETWORK/user-request.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync request ${{ steps.validate.outputs.request_id }}"
            git push origin HEAD:main
          fi

      - name: Dispatch Users Workflow
        env:
          SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -s -f \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/m-saleh-yodawy/YODAWY_USERS_REPOSITORY/actions/workflows/users.yml/dispatches"
