name: DASHBOARD - USERS WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/user-request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-users-sync-main
  cancel-in-progress: false

jobs:
  sync-dashboard-to-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_DASHBOARD_REPOSITORY
          ref: main
          persist-credentials: true

      - name: Validate Request
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, uuid
          from pathlib import Path

          def skip():
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("skip=true\n")
              raise SystemExit(0)

          req_path = Path("NETWORK/user-request.json")
          if not req_path.is_file():
              skip()

          raw = req_path.read_text(encoding="utf-8-sig").strip()
          if not raw:
              skip()

          data = json.loads(raw)
          if not isinstance(data, dict) or not data:
              skip()

          action = str(data.get("action") or "").strip().upper()
          if action in {"NONE", "NO_ACTION"}:
              skip()

          if not action:
              if not str(data.get("name") or "").strip():
                  skip()
              action = "ADD_USER"
              data["action"] = action

          if action not in {"ADD_USER", "EDIT_USER", "DELETE_USER"}:
              raise SystemExit(1)

          if not str(data.get("request_id") or "").strip():
              data["request_id"] = f"req_{uuid.uuid4().hex[:10]}"

          if action == "ADD_USER":
              name = str(data.get("name") or "").strip()
              raw_role = data.get("ROLE") if "ROLE" in data else data.get("role", "USER")
              role = re.sub(r"[\s\-_]+", "_", str(raw_role).strip().upper())
              if role == "SUPERADMIN":
                  role = "SUPER_ADMIN"
              if not name or role not in {"SUPER_ADMIN", "ADMIN", "USER"}:
                  raise SystemExit(1)
              data["ROLE"] = role
              data["status"] = "Inactive" if str(data.get("status", "Active")).strip().casefold() == "inactive" else "Active"
              data["developer"] = bool(data.get("developer", False))

          req_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Checkout Users Repository
        if: steps.validate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_USERS_REPOSITORY
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          ref: main
          path: users
          persist-credentials: true

      - name: Transfer Request and Empty Dashboard Request File
        if: steps.validate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p users/NETWORK
          cp NETWORK/user-request.json users/NETWORK/user-request.json
          cmp -s NETWORK/user-request.json users/NETWORK/user-request.json || exit 1

          cd users
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NETWORK/user-request.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync user request from Dashboard [skip ci]"
            git push origin HEAD:main
          fi

          cd ..
          printf "{}\n" > NETWORK/user-request.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NETWORK/user-request.json
          if ! git diff --cached --quiet; then
            git commit -m "Clear dashboard user request [skip ci]"
            git push origin HEAD:main
          fi

      - name: Dispatch Users Workflow
        if: steps.validate.outputs.skip != 'true'
        env:
          SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -s -f \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/m-saleh-yodawy/YODAWY_USERS_REPOSITORY/actions/workflows/users.yml/dispatches"
