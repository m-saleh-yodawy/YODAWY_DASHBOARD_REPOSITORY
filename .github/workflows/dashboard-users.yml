name: DASHBOARD - USERS WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/dashboard-users-request-*.json"
      - "NETWORK/users-request-*.json"
  workflow_dispatch:
    inputs:
      sequence:
        description: "Sequence number"
        required: false
        default: ""
        type: string
      requestId:
        description: "Transaction requestId"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-users-comm
  cancel-in-progress: false

jobs:
  send-users-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER: m-saleh-yodawy
      SOURCE_REPO: YODAWY_DASHBOARD_REPOSITORY
      TARGET_REPO: YODAWY_USERS_REPOSITORY
      BRANCH: main
      INPUT_SEQ: ${{ inputs.sequence || '' }}
      INPUT_REQ_ID: ${{ inputs.requestId || '' }}
      SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Allocate Canonical Sequence and Transmit Requests to Users Repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import copy
          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from datetime import datetime, timezone

          OWNER = os.environ["OWNER"]
          SOURCE_REPO = os.environ["SOURCE_REPO"]
          TARGET_REPO = os.environ["TARGET_REPO"]
          BRANCH = os.environ["BRANCH"]
          INPUT_SEQ = os.environ.get("INPUT_SEQ", "").strip()
          INPUT_REQ_ID = os.environ.get("INPUT_REQ_ID", "").strip()
          TOKEN = os.environ.get("SYNC_TOKEN", "").strip()
          RUN_ID = os.environ.get("GITHUB_RUN_ID", "").strip() or None
          API = "https://api.github.com"

          LOGS_PATH = "NETWORK/network-logs.json"
          LEGACY_PROCESSED_PATH = "NETWORK/processed-transactions.json"
          USERS_AUTH_PATH = "CONFIG/auth-users.json"
          TARGET_USERS_PATH = "CONFIG/users.json"

          if not TOKEN:
              raise RuntimeError("Missing YODAWY_REPOSITORIES_SYNC_TOKEN")

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "Yodawy-Dashboard-Users",
          }

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def default_network_logs():
              return {
                  "protocolVersion": 1,
                  "updatedAt": utc_now(),
                  "auditLogs": [],
                  "transactionRegistry": {
                      "processedRequestIds": [],
                      "completedRequestIds": [],
                  },
                  "transactions": {},
              }

          def api_req(method, endpoint, body=None, allow_404=False):
              data = json.dumps(body, ensure_ascii=False).encode("utf-8") if body is not None else None
              for attempt in range(1, 6):
                  req = urllib.request.Request(API + endpoint, data=data, headers=HEADERS, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          raw = resp.read().decode("utf-8")
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as err:
                      if allow_404 and err.code == 404:
                          return None
                      detail = err.read().decode("utf-8", errors="replace")
                      if err.code in {429, 500, 502, 503, 504} and attempt < 5:
                          retry_after = int(err.headers.get("Retry-After", "0") or 0)
                          time.sleep(max(retry_after, attempt * 2 + random.uniform(0.1, 1.0)))
                          continue
                      raise RuntimeError(f"HTTP {err.code} on {method} {endpoint}: {detail}") from err
                  except urllib.error.URLError as err:
                      if attempt < 5:
                          time.sleep(attempt * 2)
                          continue
                      raise RuntimeError(f"Network error on {endpoint}: {err}") from err

          def content_url(repo, path):
              return f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}?ref={BRANCH}"

          def read_json(repo, path, default=None):
              res = api_req("GET", content_url(repo, path), allow_404=True)
              if not res or not isinstance(res.get("content"), str):
                  return copy.deepcopy(default), None
              raw = base64.b64decode(res["content"].encode("ascii")).decode("utf-8-sig").strip()
              if not raw:
                  return copy.deepcopy(default), res.get("sha")
              parsed = json.loads(raw)
              return (parsed if isinstance(parsed, dict) else copy.deepcopy(default)), res.get("sha")

          def write_json(repo, path, data, msg, create_only=False, allow_empty_dict=False):
              if not isinstance(data, dict) or (not data and not allow_empty_dict):
                  raise ValueError(f"Refusing to write invalid JSON to {repo}/{path}")
              content = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              if create_only:
                  _, sha = read_json(repo, path)
                  if sha is not None:
                      raise RuntimeError("HTTP 422: File already exists")
                  api_req("PUT", endpoint, {"message": f"{msg} [skip ci]", "content": encoded, "branch": BRANCH})
                  return
              for attempt in range(1, 7):
                  cur, sha = read_json(repo, path)
                  if cur == data and sha is not None:
                      return
                  payload = {"message": f"{msg} [skip ci]", "content": encoded, "branch": BRANCH}
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", endpoint, payload)
                      return
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def delete_file(repo, path, msg):
              if path == LOGS_PATH or path.startswith("NETWORK/FAILED/"):
                  return
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 5):
                  _, sha = read_json(repo, path)
                  if not sha:
                      return
                  try:
                      api_req("DELETE", endpoint, {"message": f"{msg} [skip ci]", "sha": sha, "branch": BRANCH})
                      return
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 4:
                          time.sleep(attempt * 1.5)
                          continue
                      if "HTTP 404" in str(err):
                          return
                      raise

          def mutate_json(repo, path, default, mutator, msg, allow_empty_dict=False):
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 7):
                  cur, sha = read_json(repo, path, default)
                  if not isinstance(cur, dict):
                      cur = copy.deepcopy(default)
                  updated = mutator(copy.deepcopy(cur))
                  if not isinstance(updated, dict) or (not updated and not allow_empty_dict):
                      raise ValueError(f"Invalid mutated JSON for {repo}/{path}")
                  if updated == cur and sha is not None:
                      return updated
                  content = json.dumps(updated, ensure_ascii=False, indent=2) + "\n"
                  payload = {
                      "message": f"{msg} [skip ci]",
                      "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                      "branch": BRANCH,
                  }
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", endpoint, payload)
                      return updated
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def list_network_files(repo):
              res = api_req("GET", f"/repos/{OWNER}/{repo}/contents/NETWORK?ref={BRANCH}", allow_404=True)
              if not isinstance(res, list):
                  return []
              return sorted(str(i.get("name", "")) for i in res if isinstance(i, dict))

          def norm_id(val):
              return str(val or "").strip().upper()

          def norm_role(val):
              r = re.sub(r"[\s_-]+", "_", str(val or "USER").strip().upper())
              if r == "SUPERADMIN":
                  r = "SUPER_ADMIN"
              return r if r in {"SUPER_ADMIN", "ADMIN", "USER", "SYSTEM", "UNKNOWN"} else "UNKNOWN"

          def normalize_action(action):
              act = str(action or "").strip().upper()
              if act == "EDIT_USER":
                  return "UPDATE_USER"
              return act

          def ensure_unified_logs(repo):
              proc_doc, proc_sha = read_json(repo, LEGACY_PROCESSED_PATH, None)
              def _init(doc):
                  doc.setdefault("protocolVersion", 1)
                  audit = doc.setdefault("auditLogs", [])
                  if isinstance(doc.get("logs"), list):
                      existing_ids = {str(x.get("logId") or x.get("requestId") or x.get("transactionId") or "") for x in audit if isinstance(x, dict)}
                      for item in doc.pop("logs", []):
                          if isinstance(item, dict):
                              rid = str(item.get("requestId") or item.get("transactionId") or "")
                              item.setdefault("requestId", rid)
                              item.setdefault("transactionId", rid)
                              if rid not in existing_ids:
                                  audit.append(item)
                  reg = doc.setdefault("transactionRegistry", {"processedRequestIds": [], "completedRequestIds": []})
                  p_ids = list(dict.fromkeys(
                      [str(x).strip() for x in ((proc_doc or {}).get("processedRequestIds") or []) if str(x).strip()] +
                      [str(x).strip() for x in (doc.pop("processedRequestIds", []) or []) if str(x).strip()] +
                      [str(x).strip() for x in (reg.get("processedRequestIds") or []) if str(x).strip()]
                  ))
                  c_ids = list(dict.fromkeys(
                      [str(x).strip() for x in ((proc_doc or {}).get("completedRequestIds") or []) if str(x).strip()] +
                      [str(x).strip() for x in (doc.pop("completedRequestIds", []) or []) if str(x).strip()] +
                      [str(x).strip() for x in (reg.get("completedRequestIds") or []) if str(x).strip()]
                  ))
                  reg["processedRequestIds"] = p_ids[-500:]
                  reg["completedRequestIds"] = c_ids[-500:]
                  txs = doc.setdefault("transactions", {})
                  if isinstance(proc_doc, dict) and isinstance(proc_doc.get("transactions"), dict):
                      for k, v in proc_doc["transactions"].items():
                          if isinstance(v, dict):
                              rid = str(v.get("requestId") or k).strip()
                              txs[rid] = {**v, **txs.get(rid, {}), "requestId": rid, "transactionId": rid}
                  doc["updatedAt"] = utc_now()
                  return doc

              unified = mutate_json(repo, LOGS_PATH, default_network_logs(), _init, "Ensure unified network-logs.json")
              if proc_sha:
                  v_doc, v_sha = read_json(repo, LOGS_PATH, None)
                  if v_sha and isinstance(v_doc, dict) and isinstance(v_doc.get("transactions"), dict):
                      delete_file(repo, LEGACY_PROCESSED_PATH, "Remove migrated processed-transactions.json")
              return unified

          def load_authoritative_users():
              by_id = {}
              dash_users, dash_sha = read_json(SOURCE_REPO, USERS_AUTH_PATH, {"users": []})
              if dash_sha is None:
                  write_json(SOURCE_REPO, USERS_AUTH_PATH, {"users": []}, "Initialize canonical auth-users.json")
              target_users, _ = read_json(TARGET_REPO, TARGET_USERS_PATH, {"users": []})
              for source_list in ((target_users or {}).get("users", []), (dash_users or {}).get("users", [])):
                  if isinstance(source_list, list):
                      for u in source_list:
                          if isinstance(u, dict) and norm_id(u.get("id")):
                              uid = norm_id(u.get("id"))
                              by_id.setdefault(uid, u)
              return by_id

          def resolve_verified_actor(raw_data, auth_users_by_id):
              raw_actor = raw_data.get("actor") if isinstance(raw_data.get("actor"), dict) else {}
              claimed_id = norm_id(raw_actor.get("userId") or raw_actor.get("id") or raw_data.get("actorId"))
              if claimed_id and claimed_id in auth_users_by_id:
                  u = auth_users_by_id[claimed_id]
                  if str(u.get("status", "Active")).strip().casefold() == "active":
                      role = norm_role(u.get("role") or u.get("ROLE") or "USER")
                      return {
                          "userId": claimed_id,
                          "username": str(u.get("name") or raw_actor.get("username") or claimed_id).strip(),
                          "role": role,
                          "roleAtTimeOfAction": role,
                          "verified": True,
                          "verificationMethod": "AUTHORIZED_USER_REGISTRY",
                      }
              return {
                  "userId": claimed_id if claimed_id and claimed_id != "SYSTEM" else "UNKNOWN",
                  "username": str(raw_actor.get("username") or "Unknown / Unverified Actor").strip(),
                  "role": "UNKNOWN",
                  "roleAtTimeOfAction": "UNKNOWN",
                  "verified": False,
                  "verificationMethod": None,
              }

          def is_actor_authorized(actor_obj, canon_action, payload, auth_users_by_id):
              if not actor_obj.get("verified"):
                  return False, "Unverified or missing actor identity."
              actor_role = actor_obj.get("roleAtTimeOfAction")
              if actor_role == "SUPER_ADMIN":
                  return True, ""
              if actor_role == "ADMIN":
                  if canon_action == "SYNC_USERS":
                      return True, ""
                  target_role = norm_role(payload.get("role") or payload.get("ROLE") or "USER")
                  target_id = norm_id(payload.get("id") or payload.get("userId"))
                  existing_target = auth_users_by_id.get(target_id, {})
                  existing_target_role = norm_role(existing_target.get("role") or existing_target.get("ROLE") or "USER")
                  if target_role == "SUPER_ADMIN" or existing_target_role == "SUPER_ADMIN":
                      return False, "ADMIN cannot create, modify, or delete a SUPER_ADMIN user."
                  if canon_action in {"ADD_USER", "UPDATE_USER"}:
                      return True, ""
                  return False, f"ADMIN is not authorized to perform {canon_action}."
              return False, f"Role {actor_role} is not authorized to perform user management operations."

          def next_base_seq(logs_doc):
              names = set(list_network_files(SOURCE_REPO)) | set(list_network_files(TARGET_REPO))
              max_s = 0
              pat = re.compile(r"^dashboard-users-request-(\d{3,})\.json$")
              for n in names:
                  m = pat.match(n)
                  if m:
                      max_s = max(max_s, int(m.group(1)))
              for tx in (logs_doc.get("transactions") or {}).values():
                  if isinstance(tx, dict) and tx.get("requestType") == "DASHBOARD_USERS_SYNC":
                      s = str(tx.get("sequence", "0"))
                      if s.isdigit():
                          max_s = max(max_s, int(s))
              return max_s + 1

          ensure_unified_logs(SOURCE_REPO)
          ensure_unified_logs(TARGET_REPO)

          processor_info = {
              "type": "GITHUB_ACTIONS",
              "name": "DASHBOARD - USERS WORKFLOW",
              "repository": f"{OWNER}/{SOURCE_REPO}",
              "runId": RUN_ID,
          }

          target_files = list_network_files(TARGET_REPO)
          for n in target_files:
              if re.fullmatch(r"users-request-\d{3,}\.json", n):
                  delete_file(TARGET_REPO, f"NETWORK/{n}", f"Remove legacy duplicate {n}")

          source_files = list_network_files(SOURCE_REPO)
          for n in list(source_files):
              m_leg = re.fullmatch(r"users-request-(\d{3,})\.json", n)
              if m_leg:
                  leg_seq = m_leg.group(1)
                  leg_path = f"NETWORK/{n}"
                  canon_equiv = f"NETWORK/dashboard-users-request-{leg_seq}.json"
                  leg_data, _ = read_json(SOURCE_REPO, leg_path, {})
                  if f"dashboard-users-request-{leg_seq}.json" not in source_files and isinstance(leg_data, dict) and leg_data:
                      write_json(SOURCE_REPO, canon_equiv, leg_data, f"Migrate legacy {n} to canonical request")
                      source_files.append(f"dashboard-users-request-{leg_seq}.json")
                  delete_file(SOURCE_REPO, leg_path, f"Remove legacy request file {n}")

          candidate_paths = []
          if INPUT_SEQ and re.fullmatch(r"\d{3,}", INPUT_SEQ):
              p = f"NETWORK/dashboard-users-request-{INPUT_SEQ}.json"
              if p.split("/")[1] in source_files:
                  candidate_paths.append(p)
          for n in sorted(set(source_files)):
              if re.fullmatch(r"dashboard-users-request-\d{3,}\.json", n):
                  p = f"NETWORK/{n}"
                  if p not in candidate_paths:
                      candidate_paths.append(p)

          seen_request_ids_in_run = set()
          seen_add_names_in_run = set()
          auth_users_by_id = load_authoritative_users()

          for source_path in candidate_paths:
              raw_data, _ = read_json(SOURCE_REPO, source_path)
              if not isinstance(raw_data, dict) or not raw_data:
                  continue

              payload = raw_data.get("payload") if isinstance(raw_data.get("payload"), dict) else dict(raw_data)
              request_id = str(raw_data.get("requestId") or payload.get("requestId") or INPUT_REQ_ID or "").strip()
              if not request_id:
                  request_id = f"DASH-USERS-{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}-{uuid.uuid4().hex[:8].upper()}"

              if request_id in seen_request_ids_in_run:
                  delete_file(SOURCE_REPO, source_path, f"Remove duplicate request file for {request_id}")
                  continue
              seen_request_ids_in_run.add(request_id)

              logs_state, _ = read_json(SOURCE_REPO, LOGS_PATH, default_network_logs())
              reg_block = logs_state.get("transactionRegistry") or {}
              completed_ids = set(reg_block.get("completedRequestIds", []))
              processed_ids = set(reg_block.get("processedRequestIds", []))
              existing_tx = (logs_state.get("transactions") or {}).get(request_id, {})

              if request_id in completed_ids or request_id in processed_ids or existing_tx.get("status") == "COMPLETED":
                  delete_file(SOURCE_REPO, source_path, f"Remove completed request {request_id}")
                  continue

              if existing_tx.get("status") in {"SENT", "PROCESSING", "PROCESSED", "RESPONSE_SENT"}:
                  t_seq = str(existing_tx.get("sequence") or raw_data.get("sequence") or "001")
                  t_check, _ = read_json(TARGET_REPO, f"NETWORK/dashboard-users-request-{t_seq}.json")
                  u_logs, _ = read_json(TARGET_REPO, LOGS_PATH, default_network_logs())
                  u_tx = (u_logs.get("transactions") or {}).get(request_id, {})
                  if (isinstance(t_check, dict) and t_check.get("requestId") == request_id) or u_tx.get("status") in {"PROCESSING", "PROCESSED", "RESPONSE_SENT", "COMPLETED"}:
                      continue

              raw_action = str(payload.get("action") or raw_data.get("action") or "").strip().upper()
              if not raw_action:
                  if str(payload.get("name") or "").strip() and not str(payload.get("id") or payload.get("userId") or "").strip():
                      raw_action = "ADD_USER"
                  elif isinstance(payload.get("users"), list):
                      raw_action = "SYNC_USERS"
                  else:
                      continue

              wire_action = "EDIT_USER" if raw_action in {"UPDATE_USER", "EDIT_USER", "CHANGE_USER_ROLE", "CHANGE_USER_STATUS"} else raw_action
              canon_action = normalize_action(raw_action)

              if wire_action not in {"ADD_USER", "EDIT_USER", "DELETE_USER", "SYNC_USERS"}:
                  ts_err = utc_now()
                  write_json(SOURCE_REPO, f"NETWORK/FAILED/{request_id}.json", {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "transactionId": request_id,
                      "status": "FAILED",
                      "request": raw_data,
                      "error": f"Unsupported action: {raw_action}",
                      "failedAt": ts_err,
                  }, f"Reject unsupported action {request_id}")
                  raise RuntimeError(f"Unsupported action: {raw_action}")

              actor_obj = resolve_verified_actor(raw_data, auth_users_by_id)
              authorized, auth_err = is_actor_authorized(actor_obj, canon_action, payload, auth_users_by_id)
              if not authorized:
                  ts_rej = utc_now()
                  write_json(SOURCE_REPO, f"NETWORK/FAILED/{request_id}.json", {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "transactionId": request_id,
                      "status": "REJECTED",
                      "actor": actor_obj,
                      "processor": processor_info,
                      "request": raw_data,
                      "error": auth_err,
                      "failedAt": ts_rej,
                  }, f"Reject unauthorized actor for {request_id}")

                  def _rec_reject(doc):
                      doc.setdefault("protocolVersion", 1)
                      doc.setdefault("transactionRegistry", {"processedRequestIds": [], "completedRequestIds": []})
                      doc.setdefault("transactions", {})[request_id] = {
                          "requestId": request_id,
                          "transactionId": request_id,
                          "requestType": "DASHBOARD_USERS_SYNC",
                          "action": canon_action,
                          "status": "REJECTED",
                          "actor": actor_obj,
                          "processor": processor_info,
                          "failedAt": ts_rej,
                          "updatedAt": ts_rej,
                          "lastError": auth_err,
                          "workflowRunId": RUN_ID,
                      }
                      doc.setdefault("auditLogs", []).append({
                          "logId": f"AUDIT-{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}-{uuid.uuid4().hex[:8].upper()}",
                          "requestId": request_id,
                          "transactionId": request_id,
                          "timestamp": ts_rej,
                          "action": canon_action,
                          "rawAction": raw_action,
                          "category": "USER_MANAGEMENT",
                          "requestType": "DASHBOARD_USERS_SYNC",
                          "status": "REJECTED",
                          "actor": actor_obj,
                          "processor": processor_info,
                          "target": {"type": "USER", "userId": norm_id(payload.get("id") or payload.get("userId")) or None, "username": str(payload.get("name") or "Target User")},
                          "changes": {"previous": None, "current": None},
                          "summary": auth_err,
                          "details": auth_err,
                      })
                      doc["updatedAt"] = ts_rej
                      return doc

                  mutate_json(SOURCE_REPO, LOGS_PATH, default_network_logs(), _rec_reject, f"Log rejected request {request_id}")
                  delete_file(SOURCE_REPO, source_path, f"Remove rejected request {request_id}")
                  raise RuntimeError(auth_err)

              if wire_action == "ADD_USER":
                  name = " ".join(str(payload.get("name") or "").strip().split())
                  if not name:
                      raise RuntimeError("ADD_USER requires name")
                  name_cf = name.casefold()
                  if name_cf in seen_add_names_in_run:
                      delete_file(SOURCE_REPO, source_path, f"Remove duplicate ADD_USER request for {name}")
                      continue
                  seen_add_names_in_run.add(name_cf)
                  role = norm_role(payload.get("role") or payload.get("ROLE") or "USER")
                  if role not in {"SUPER_ADMIN", "ADMIN", "USER"}:
                      raise RuntimeError(f"Invalid role: {role}")
                  status_val = "Inactive" if str(payload.get("status", "Active")).strip().casefold() == "inactive" else "Active"
                  dev = payload.get("developer", False)
                  dev = dev.strip().casefold() in {"true", "1", "yes"} if isinstance(dev, str) else bool(dev)
                  normalized_payload = {"action": "ADD_USER", "name": name, "role": role, "status": status_val, "developer": dev}
                  if str(payload.get("id") or "").strip():
                      normalized_payload["id"] = norm_id(payload.get("id"))
              elif wire_action in {"EDIT_USER", "DELETE_USER"}:
                  uid = norm_id(payload.get("id") or payload.get("userId"))
                  if not uid:
                      raise RuntimeError(f"{wire_action} requires user ID")
                  normalized_payload = dict(payload)
                  normalized_payload["action"] = wire_action
                  normalized_payload["id"] = uid
                  if "name" in normalized_payload and str(normalized_payload["name"]).strip():
                      normalized_payload["name"] = " ".join(str(normalized_payload["name"]).strip().split())
              else:
                  normalized_payload = dict(payload)
                  normalized_payload["action"] = "SYNC_USERS"

              seq_match = re.search(r"-(\d{3,})\.json$", source_path)
              preferred_seq = int(seq_match.group(1)) if seq_match else next_base_seq(logs_state)

              allocated_seq = None
              request_obj = None
              channel_path = None

              for offset in range(25):
                  cand_seq = f"{preferred_seq + offset:03d}"
                  cand_channel_path = f"NETWORK/dashboard-users-request-{cand_seq}.json"
                  existing_target, _ = read_json(TARGET_REPO, cand_channel_path)
                  if isinstance(existing_target, dict) and existing_target and existing_target.get("requestId") != request_id:
                      continue
                  existing_source, _ = read_json(SOURCE_REPO, cand_channel_path)
                  if isinstance(existing_source, dict) and existing_source and cand_channel_path != source_path and existing_source.get("requestId") != request_id:
                      continue

                  ts = utc_now()
                  cand_obj = {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "transactionId": request_id,
                      "sequence": cand_seq,
                      "requestType": "DASHBOARD_USERS_SYNC",
                      "status": "SENT",
                      "createdAt": raw_data.get("createdAt") or ts,
                      "sentAt": ts,
                      "actor": actor_obj,
                      "processor": processor_info,
                      "source": {"owner": OWNER, "repository": SOURCE_REPO, "branch": BRANCH},
                      "destination": {"owner": OWNER, "repository": TARGET_REPO, "branch": BRANCH},
                      "requestPath": cand_channel_path,
                      "action": wire_action,
                      "canonicalAction": canon_action,
                      "rawAction": raw_action,
                      "payload": normalized_payload,
                  }
                  try:
                      if not existing_target:
                          write_json(TARGET_REPO, cand_channel_path, cand_obj, f"Deliver dashboard request {request_id}", create_only=True)
                      else:
                          write_json(TARGET_REPO, cand_channel_path, cand_obj, f"Update dashboard request {request_id}")
                      allocated_seq = cand_seq
                      request_obj = cand_obj
                      channel_path = cand_channel_path
                      break
                  except RuntimeError as err:
                      if "HTTP 422" in str(err) or "HTTP 409" in str(err):
                          continue
                      raise

              if not allocated_seq:
                  raise RuntimeError(f"Failed to allocate sequence for request {request_id}")

              def _record_sent(doc):
                  doc.setdefault("protocolVersion", 1)
                  doc.setdefault("transactionRegistry", {"processedRequestIds": [], "completedRequestIds": []})
                  doc.setdefault("auditLogs", [])
                  tx = doc.setdefault("transactions", {}).setdefault(request_id, {})
                  tx.update({
                      "requestId": request_id,
                      "transactionId": request_id,
                      "sequence": allocated_seq,
                      "requestType": "DASHBOARD_USERS_SYNC",
                      "action": canon_action,
                      "rawAction": raw_action,
                      "actor": actor_obj,
                      "processor": processor_info,
                      "source": {"owner": OWNER, "repository": SOURCE_REPO, "branch": BRANCH},
                      "destination": {"owner": OWNER, "repository": TARGET_REPO, "branch": BRANCH},
                      "status": "SENT",
                      "createdAt": request_obj["createdAt"],
                      "sentAt": request_obj["sentAt"],
                      "updatedAt": utc_now(),
                      "attempts": int(tx.get("attempts", 0)) + 1,
                      "requestPath": channel_path,
                      "responseRequired": True,
                      "workflowRunId": RUN_ID,
                  })
                  doc["updatedAt"] = utc_now()
                  return doc

              mutate_json(SOURCE_REPO, LOGS_PATH, default_network_logs(), _record_sent, f"Track sent transaction {request_id}")

              write_json(SOURCE_REPO, channel_path, request_obj, f"Record outbound users request {request_id}")
              if source_path != channel_path:
                  delete_file(SOURCE_REPO, source_path, f"Remove unallocated source request {request_id}")

              api_req("POST", f"/repos/{OWNER}/{TARGET_REPO}/dispatches", {
                  "event_type": "dashboard_users_sync_requested",
                  "client_payload": {
                      "requestId": request_id,
                      "sequence": allocated_seq,
                      "requestType": "DASHBOARD_USERS_SYNC",
                      "requestPath": channel_path,
                  },
              })
          PY
