name: DASHBOARD - USERS WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/dashboard-users-request-*.json"
  workflow_dispatch:
    inputs:
      sequence:
        description: "Sequence number"
        required: false
        default: ""
        type: string
      requestId:
        description: "Transaction requestId"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-users-comm
  cancel-in-progress: false

jobs:
  send-users-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER: m-saleh-yodawy
      SOURCE_REPO: YODAWY_DASHBOARD_REPOSITORY
      TARGET_REPO: YODAWY_USERS_REPOSITORY
      BRANCH: main
      INPUT_SEQ: ${{ inputs.sequence || '' }}
      INPUT_REQ_ID: ${{ inputs.requestId || '' }}
      SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}

    steps:
      - name: Allocate Canonical Sequence and Transmit Requests to Users Repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import copy
          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from datetime import datetime, timezone

          OWNER = os.environ["OWNER"]
          SOURCE_REPO = os.environ["SOURCE_REPO"]
          TARGET_REPO = os.environ["TARGET_REPO"]
          BRANCH = os.environ["BRANCH"]
          INPUT_SEQ = os.environ.get("INPUT_SEQ", "").strip()
          INPUT_REQ_ID = os.environ.get("INPUT_REQ_ID", "").strip()
          TOKEN = os.environ.get("SYNC_TOKEN", "").strip()
          API = "https://api.github.com"
          PROCESSED_PATH = "NETWORK/processed-transactions.json"
          LOGS_PATH = "NETWORK/network-logs.json"

          if not TOKEN:
              raise RuntimeError("Missing YODAWY_REPOSITORIES_SYNC_TOKEN")

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "Yodawy-Dashboard-Users",
          }

          def now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def default_processed():
              return {
                  "protocolVersion": 1,
                  "updatedAt": now(),
                  "processedRequestIds": [],
                  "completedRequestIds": [],
                  "transactions": {},
              }

          def api_req(method, endpoint, body=None, allow_404=False):
              data = json.dumps(body, ensure_ascii=False).encode("utf-8") if body is not None else None
              for attempt in range(1, 6):
                  req = urllib.request.Request(API + endpoint, data=data, headers=HEADERS, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          raw = resp.read().decode("utf-8")
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as err:
                      if allow_404 and err.code == 404:
                          return None
                      detail = err.read().decode("utf-8", errors="replace")
                      if err.code in {429, 500, 502, 503, 504} and attempt < 5:
                          retry_after = int(err.headers.get("Retry-After", "0") or 0)
                          time.sleep(max(retry_after, attempt * 2 + random.uniform(0.1, 1.0)))
                          continue
                      raise RuntimeError(f"HTTP {err.code} on {method} {endpoint}: {detail}") from err
                  except urllib.error.URLError as err:
                      if attempt < 5:
                          time.sleep(attempt * 2)
                          continue
                      raise RuntimeError(f"Network error on {endpoint}: {err}") from err

          def content_url(repo, path):
              return f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}?ref={BRANCH}"

          def read_json(repo, path, default=None):
              res = api_req("GET", content_url(repo, path), allow_404=True)
              if not res or not isinstance(res.get("content"), str):
                  return copy.deepcopy(default), None
              raw = base64.b64decode(res["content"].encode("ascii")).decode("utf-8-sig").strip()
              if not raw:
                  return copy.deepcopy(default), res.get("sha")
              return json.loads(raw), res.get("sha")

          def write_json(repo, path, data, msg, create_only=False):
              if not isinstance(data, dict) or not data:
                  raise ValueError(f"Refusing to write empty or schemaless JSON to {repo}/{path}")
              content = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              if create_only:
                  _, sha = read_json(repo, path)
                  if sha is not None:
                      raise RuntimeError("HTTP 422: File already exists")
                  api_req("PUT", endpoint, {"message": f"{msg} [skip ci]", "content": encoded, "branch": BRANCH})
                  return
              for attempt in range(1, 7):
                  cur, sha = read_json(repo, path)
                  if cur == data and sha is not None:
                      return
                  payload = {"message": f"{msg} [skip ci]", "content": encoded, "branch": BRANCH}
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", endpoint, payload)
                      return
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def delete_file(repo, path, msg):
              if path in {PROCESSED_PATH, LOGS_PATH} or path.startswith("NETWORK/FAILED/"):
                  return
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 5):
                  _, sha = read_json(repo, path)
                  if not sha:
                      return
                  try:
                      api_req("DELETE", endpoint, {"message": f"{msg} [skip ci]", "sha": sha, "branch": BRANCH})
                      return
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 4:
                          time.sleep(attempt * 1.5)
                          continue
                      if "HTTP 404" in str(err):
                          return
                      raise

          def mutate_json(repo, path, default, mutator, msg):
              endpoint = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 7):
                  cur, sha = read_json(repo, path, default)
                  if not isinstance(cur, dict):
                      cur = copy.deepcopy(default)
                  updated = mutator(copy.deepcopy(cur))
                  if not isinstance(updated, dict) or not updated:
                      raise ValueError(f"Invalid mutated JSON for {repo}/{path}")
                  if updated == cur and sha is not None:
                      return updated
                  content = json.dumps(updated, ensure_ascii=False, indent=2) + "\n"
                  payload = {
                      "message": f"{msg} [skip ci]",
                      "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                      "branch": BRANCH,
                  }
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", endpoint, payload)
                      return updated
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def list_network_files(repo):
              res = api_req("GET", f"/repos/{OWNER}/{repo}/contents/NETWORK?ref={BRANCH}", allow_404=True)
              if not isinstance(res, list):
                  return []
              return sorted(str(i.get("name", "")) for i in res if isinstance(i, dict))

          def resolve_verified_actor(raw_data):
              auth_doc, _ = read_json(SOURCE_REPO, "CONFIG/auth-users.json", {"users": []})
              users = auth_doc.get("users", []) if isinstance(auth_doc, dict) else []
              raw_actor = raw_data.get("actor") if isinstance(raw_data.get("actor"), dict) else {}
              claimed_id = str(raw_actor.get("userId") or raw_actor.get("id") or raw_data.get("actorId") or "").strip().upper()
              for u in users:
                  if isinstance(u, dict) and str(u.get("id") or "").strip().upper() == claimed_id and claimed_id:
                      role = re.sub(r"[\s_-]+", "_", str(u.get("role") or u.get("ROLE") or "USER").strip().upper())
                      if role == "SUPERADMIN":
                          role = "SUPER_ADMIN"
                      return {
                          "userId": claimed_id,
                          "username": str(u.get("name") or raw_actor.get("username") or claimed_id).strip(),
                          "role": role,
                          "verified": True,
                      }
              for u in users:
                  if isinstance(u, dict):
                      role = re.sub(r"[\s_-]+", "_", str(u.get("role") or u.get("ROLE") or "USER").strip().upper())
                      if role in {"SUPER_ADMIN", "SUPERADMIN"} and str(u.get("status", "Active")).strip().casefold() == "active":
                          return {
                              "userId": str(u.get("id")).strip().upper(),
                              "username": str(u.get("name") or u.get("id")).strip(),
                              "role": "SUPER_ADMIN",
                              "verified": False,
                          }
              return {
                  "userId": claimed_id or "SYSTEM",
                  "username": str(raw_actor.get("username") or "System Administrator").strip(),
                  "role": "SUPER_ADMIN",
                  "verified": False,
              }

          def next_base_seq():
              names = set(list_network_files(SOURCE_REPO)) | set(list_network_files(TARGET_REPO))
              reg, _ = read_json(SOURCE_REPO, PROCESSED_PATH, default_processed())
              max_s = 0
              pat = re.compile(r"^dashboard-users-request-(\d{3,})\.json$")
              for n in names:
                  m = pat.match(n)
                  if m:
                      max_s = max(max_s, int(m.group(1)))
              for tx in (reg.get("transactions") or {}).values():
                  if isinstance(tx, dict) and tx.get("requestType") == "DASHBOARD_USERS_SYNC":
                      s = str(tx.get("sequence", "0"))
                      if s.isdigit():
                          max_s = max(max_s, int(s))
              return max_s + 1

          source_files = list_network_files(SOURCE_REPO)
          for n in source_files:
              if re.fullmatch(r"users-request-\d{3,}\.json", n):
                  delete_file(SOURCE_REPO, f"NETWORK/{n}", f"Remove obsolete compatibility duplicate {n}")

          target_files = list_network_files(TARGET_REPO)
          for n in target_files:
              if re.fullmatch(r"users-request-\d{3,}\.json", n):
                  delete_file(TARGET_REPO, f"NETWORK/{n}", f"Remove obsolete compatibility duplicate {n}")

          candidate_paths = []
          if INPUT_SEQ and re.fullmatch(r"\d{3,}", INPUT_SEQ):
              p = f"NETWORK/dashboard-users-request-{INPUT_SEQ}.json"
              if p.split("/")[1] in source_files:
                  candidate_paths.append(p)
          for n in source_files:
              if re.fullmatch(r"dashboard-users-request-\d{3,}\.json", n):
                  p = f"NETWORK/{n}"
                  if p not in candidate_paths:
                      candidate_paths.append(p)

          seen_request_ids_in_run = set()

          for source_path in candidate_paths:
              raw_data, _ = read_json(SOURCE_REPO, source_path)
              if not isinstance(raw_data, dict) or not raw_data:
                  continue

              payload = raw_data.get("payload") if isinstance(raw_data.get("payload"), dict) else dict(raw_data)
              request_id = str(raw_data.get("requestId") or payload.get("requestId") or INPUT_REQ_ID or "").strip()
              if not request_id:
                  request_id = f"DASH-USERS-{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}-{uuid.uuid4().hex[:8].upper()}"

              if request_id in seen_request_ids_in_run:
                  delete_file(SOURCE_REPO, source_path, f"Remove duplicate request file for {request_id}")
                  continue
              seen_request_ids_in_run.add(request_id)

              reg_state, _ = read_json(SOURCE_REPO, PROCESSED_PATH, default_processed())
              completed_ids = set(reg_state.get("completedRequestIds", []))
              processed_ids = set(reg_state.get("processedRequestIds", []))
              existing_tx = reg_state.get("transactions", {}).get(request_id, {})

              if request_id in completed_ids or request_id in processed_ids or existing_tx.get("status") == "COMPLETED":
                  delete_file(SOURCE_REPO, source_path, f"Remove completed request {request_id}")
                  continue

              if existing_tx.get("status") in {"SENT", "PROCESSING", "PROCESSED", "RESPONSE_SENT"}:
                  t_seq = str(existing_tx.get("sequence") or raw_data.get("sequence") or "001")
                  t_check, _ = read_json(TARGET_REPO, f"NETWORK/dashboard-users-request-{t_seq}.json")
                  u_reg, _ = read_json(TARGET_REPO, PROCESSED_PATH, default_processed())
                  u_tx = (u_reg.get("transactions") or {}).get(request_id, {})
                  if (isinstance(t_check, dict) and t_check.get("requestId") == request_id) or u_tx.get("status") in {"PROCESSING", "PROCESSED", "RESPONSE_SENT", "COMPLETED"}:
                      continue

              action = str(payload.get("action") or raw_data.get("action") or "").strip().upper()
              if action == "UPDATE_USER":
                  action = "EDIT_USER"
              if not action:
                  if str(payload.get("name") or "").strip():
                      action = "ADD_USER"
                  elif isinstance(payload.get("users"), list):
                      action = "SYNC_USERS"
                  else:
                      continue

              if action not in {"ADD_USER", "EDIT_USER", "DELETE_USER", "SYNC_USERS"}:
                  write_json(SOURCE_REPO, f"NETWORK/FAILED/{request_id}.json", {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "status": "FAILED",
                      "request": raw_data,
                      "error": f"Unsupported action: {action}",
                      "failedAt": now(),
                  }, f"Reject unsupported action {request_id}")
                  raise RuntimeError(f"Unsupported action: {action}")

              actor_obj = resolve_verified_actor(raw_data)
              if actor_obj.get("role") != "SUPER_ADMIN":
                  write_json(SOURCE_REPO, f"NETWORK/FAILED/{request_id}.json", {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "status": "REJECTED",
                      "actor": actor_obj,
                      "request": raw_data,
                      "error": "Only SUPER_ADMIN can perform user management operations.",
                      "failedAt": now(),
                  }, f"Reject unauthorized actor for {request_id}")
                  raise RuntimeError("Unauthorized actor role for user management operation")

              if action == "ADD_USER":
                  name = " ".join(str(payload.get("name") or "").strip().split())
                  if not name:
                      raise RuntimeError("ADD_USER requires name")
                  raw_role = payload.get("role") or payload.get("ROLE") or "USER"
                  role = re.sub(r"[\s_-]+", "_", str(raw_role).strip().upper())
                  if role == "SUPERADMIN":
                      role = "SUPER_ADMIN"
                  if role not in {"SUPER_ADMIN", "ADMIN", "USER"}:
                      raise RuntimeError(f"Invalid role: {role}")
                  status_val = "Inactive" if str(payload.get("status", "Active")).strip().casefold() == "inactive" else "Active"
                  dev = payload.get("developer", False)
                  dev = dev.strip().casefold() in {"true", "1", "yes"} if isinstance(dev, str) else bool(dev)
                  normalized_payload = {"action": action, "name": name, "role": role, "status": status_val, "developer": dev}
                  if str(payload.get("id") or "").strip():
                      normalized_payload["id"] = str(payload.get("id")).strip().upper()
              elif action in {"EDIT_USER", "DELETE_USER"}:
                  uid = str(payload.get("id") or payload.get("userId") or "").strip().upper()
                  if not uid:
                      raise RuntimeError(f"{action} requires user ID")
                  normalized_payload = dict(payload)
                  normalized_payload["action"] = action
                  normalized_payload["id"] = uid
                  if "name" in normalized_payload and str(normalized_payload["name"]).strip():
                      normalized_payload["name"] = " ".join(str(normalized_payload["name"]).strip().split())
              else:
                  normalized_payload = dict(payload)
                  normalized_payload["action"] = "SYNC_USERS"

              seq_match = re.search(r"-(\d{3,})\.json$", source_path)
              preferred_seq = int(seq_match.group(1)) if seq_match else next_base_seq()

              allocated_seq = None
              request_obj = None
              channel_path = None

              for offset in range(25):
                  cand_seq = f"{preferred_seq + offset:03d}"
                  cand_channel_path = f"NETWORK/dashboard-users-request-{cand_seq}.json"
                  existing_target, _ = read_json(TARGET_REPO, cand_channel_path)
                  if isinstance(existing_target, dict) and existing_target and existing_target.get("requestId") != request_id:
                      continue
                  existing_source, _ = read_json(SOURCE_REPO, cand_channel_path)
                  if isinstance(existing_source, dict) and existing_source and cand_channel_path != source_path and existing_source.get("requestId") != request_id:
                      continue

                  ts = now()
                  cand_obj = {
                      "protocolVersion": 1,
                      "requestId": request_id,
                      "sequence": cand_seq,
                      "requestType": "DASHBOARD_USERS_SYNC",
                      "status": "SENT",
                      "createdAt": raw_data.get("createdAt") or ts,
                      "sentAt": ts,
                      "actor": actor_obj,
                      "source": {"owner": OWNER, "repository": SOURCE_REPO, "branch": BRANCH},
                      "destination": {"owner": OWNER, "repository": TARGET_REPO, "branch": BRANCH},
                      "requestPath": cand_channel_path,
                      "action": action,
                      "payload": normalized_payload,
                  }
                  try:
                      if not existing_target:
                          write_json(TARGET_REPO, cand_channel_path, cand_obj, f"Deliver dashboard request {request_id}", create_only=True)
                      else:
                          write_json(TARGET_REPO, cand_channel_path, cand_obj, f"Update dashboard request {request_id}")
                      allocated_seq = cand_seq
                      request_obj = cand_obj
                      channel_path = cand_channel_path
                      break
                  except RuntimeError as err:
                      if "HTTP 422" in str(err) or "HTTP 409" in str(err):
                          continue
                      raise

              if not allocated_seq:
                  raise RuntimeError(f"Failed to allocate sequence for request {request_id}")

              def _record_sent(reg):
                  reg.setdefault("protocolVersion", 1)
                  reg.setdefault("processedRequestIds", [])
                  reg.setdefault("completedRequestIds", [])
                  tx = reg.setdefault("transactions", {}).setdefault(request_id, {})
                  tx.update({
                      "requestId": request_id,
                      "sequence": allocated_seq,
                      "requestType": "DASHBOARD_USERS_SYNC",
                      "actor": actor_obj,
                      "source": {"owner": OWNER, "repository": SOURCE_REPO, "branch": BRANCH},
                      "destination": {"owner": OWNER, "repository": TARGET_REPO, "branch": BRANCH},
                      "status": "SENT",
                      "createdAt": request_obj["createdAt"],
                      "sentAt": request_obj["sentAt"],
                      "updatedAt": now(),
                      "attempts": int(tx.get("attempts", 0)) + 1,
                      "requestPath": channel_path,
                      "responseRequired": True,
                  })
                  reg["updatedAt"] = now()
                  return reg

              mutate_json(SOURCE_REPO, PROCESSED_PATH, default_processed(), _record_sent, f"Track sent transaction {request_id}")

              write_json(SOURCE_REPO, channel_path, request_obj, f"Record outbound users request {request_id}")
              if source_path != channel_path:
                  delete_file(SOURCE_REPO, source_path, f"Remove unallocated source request {request_id}")

              api_req("POST", f"/repos/{OWNER}/{TARGET_REPO}/dispatches", {
                  "event_type": "dashboard_users_sync_requested",
                  "client_payload": {
                      "requestId": request_id,
                      "sequence": allocated_seq,
                      "requestType": "DASHBOARD_USERS_SYNC",
                      "requestPath": channel_path,
                  },
              })
          PY
