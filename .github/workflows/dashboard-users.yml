name: DASHBOARD - USERS WORKFLOW

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yodawy-dashboard-users-sync-main
  cancel-in-progress: false

jobs:
  sync-dashboard-to-users:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify Source Files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            CONFIG/auth-users.json \
            CONFIG/tools-permissions.json \
            CONFIG/tools-visibility.json \
            REQUESTS/user-request.json
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required source file not found: $file"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = (
              "CONFIG/auth-users.json",
              "CONFIG/tools-permissions.json",
              "CONFIG/tools-visibility.json",
          )

          parsed = {}

          for name in paths:
              content = Path(name).read_text(
                  encoding="utf-8-sig"
              ).strip()

              if not content:
                  raise SystemExit(
                      f"Source file is empty: {name}"
                  )

              try:
                  data = json.loads(content)
              except Exception as error:
                  raise SystemExit(
                      f"Invalid JSON in {name}: {error}"
                  )

              if not isinstance(data, dict):
                  raise SystemExit(
                      f"Expected a JSON object in {name}"
                  )

              parsed[name] = data

          users_data = parsed["CONFIG/auth-users.json"]
          users = users_data.get("users")

          if not isinstance(users, list):
              raise SystemExit(
                  "CONFIG/auth-users.json must contain a users array."
              )

          seen_ids = set()

          for user in users:
              if not isinstance(user, dict):
                  raise SystemExit(
                      "Each users entry must be an object."
                  )

              user_id = user.get("id")

              # Allow a blank ID for a new employee.
              # The USERS SYNC workflow will allocate the ID.
              if user_id is None or (
                  isinstance(user_id, str)
                  and not user_id.strip()
              ):
                  if not str(
                      user.get("name", "")
                  ).strip():
                      raise SystemExit(
                          "Every user needs a non-empty name."
                      )

                  print(
                      "ID pending allocation for: "
                      f"{user['name']}"
                  )
                  continue

              if not isinstance(user_id, str):
                  raise SystemExit(
                      "User ID must be a string or empty."
                  )

              normalized_id = user_id.strip().upper()

              if normalized_id in seen_ids:
                  raise SystemExit(
                      f"Duplicate user id: {normalized_id}"
                  )

              seen_ids.add(normalized_id)

          if not users:
              raise SystemExit(
                  "No users configured. Add a user before syncing."
              )

          # Validate the incoming user request.
          request_path = Path(
              "REQUESTS/user-request.json"
          )

          request_content = request_path.read_text(
              encoding="utf-8-sig"
          ).strip()

          if not request_content:
              raise SystemExit(
                  "REQUESTS/user-request.json is empty."
              )

          try:
              request_data = json.loads(request_content)
          except Exception as error:
              raise SystemExit(
                  f"Invalid user request JSON: {error}"
              )

          if not isinstance(request_data, dict):
              raise SystemExit(
                  "User request must be a JSON object."
              )

          allowed_actions = {
              "ADD_USER",
              "EDIT_USER",
              "DELETE_USER",
          }

          if "requests" in request_data:
              requests = request_data["requests"]

              if not isinstance(requests, list):
                  raise SystemExit(
                      "'requests' must be a JSON array."
                  )

              for index, request in enumerate(requests):
                  if not isinstance(request, dict):
                      raise SystemExit(
                          f"Request at index {index} must be an object."
                      )

                  action = request.get("action")

                  if action not in allowed_actions:
                      raise SystemExit(
                          f"Invalid action at request index {index}: "
                          f"{action}"
                      )

              print(
                  f"User requests found: {len(requests)}"
              )

          else:
              action = request_data.get("action")

              if action not in allowed_actions:
                  raise SystemExit(
                      f"Invalid user request action: {action}"
                  )

              print(f"User request action: {action}")

          print("Dashboard source files validated.")
          print(f"Users found: {len(users)}")
          print("Blank IDs will be allocated by USERS SYNC.")
          PY

      - name: Verify Sync Token
        env:
          SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::YODAWY_REPOSITORIES_SYNC_TOKEN is missing."
            exit 1
          fi

          echo "Sync token is available."

      - name: Checkout Users Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_USERS_REPOSITORY
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          ref: main
          path: users
          persist-credentials: true

      - name: Prepare Users Data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p users/CONFIG
          mkdir -p users/REQUESTS

          cp CONFIG/auth-users.json \
            users/CONFIG/users.json

          cp CONFIG/tools-permissions.json \
            users/CONFIG/tools-permissions.json

          cp CONFIG/tools-visibility.json \
            users/CONFIG/tools-visibility.json

          cp REQUESTS/user-request.json \
            users/REQUESTS/user-request.json

          echo "Users destination files prepared."
          echo "User request file copied."

      - name: Commit and Push Changes
        working-directory: users
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            CONFIG/users.json \
            CONFIG/tools-permissions.json \
            CONFIG/tools-visibility.json \
            REQUESTS/user-request.json

          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync dashboard users, requests and tool settings"
            git push origin HEAD:main
            echo "Dashboard data pushed to Users Repository."
          fi

      - name: Dispatch USERS SYNC
        env:
          SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::YODAWY_REPOSITORIES_SYNC_TOKEN is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SYNC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/m-saleh-yodawy/YODAWY_USERS_REPOSITORY/actions/workflows/users.yml/dispatches")"

          if [[ "$http_code" != "204" ]]; then
            echo "::error::Failed to dispatch USERS SYNC. HTTP ${http_code}"

            if [[ -s "$response_file" ]]; then
              cat "$response_file"
            fi

            exit 1
          fi

          echo "USERS SYNC was dispatched successfully."
