name: DASHBOARD - USERS WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - NETWORK/user-request.json

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yodawy-dashboard-users-sync-main
  cancel-in-progress: false

jobs:
  sync-dashboard-to-users:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Dashboard Repository
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_DASHBOARD_REPOSITORY
          ref: main
          persist-credentials: false

      # 2. Validate the User Request
      - name: Validate User Request
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          request_path = Path("NETWORK/user-request.json")

          if not request_path.is_file():
              raise SystemExit(
                  "ERROR: NETWORK/user-request.json was not found."
              )

          content = request_path.read_text(
              encoding="utf-8-sig"
          ).strip()

          if not content:
              raise SystemExit(
                  "ERROR: NETWORK/user-request.json is empty."
              )

          try:
              data = json.loads(content)
          except json.JSONDecodeError as error:
              raise SystemExit(
                  f"ERROR: Invalid user request JSON: {error}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: User request must be a JSON object."
              )

          allowed_actions = {
              "ADD_USER",
              "EDIT_USER",
              "DELETE_USER"
          }

          if "requests" in data:
              requests = data["requests"]

              if not isinstance(requests, list) or not requests:
                  raise SystemExit(
                      "ERROR: 'requests' must be a non-empty array."
                  )

              for index, request in enumerate(requests):
                  if not isinstance(request, dict):
                      raise SystemExit(
                          f"ERROR: Request {index} must be an object."
                      )

                  action = request.get("action")

                  if action not in allowed_actions:
                      raise SystemExit(
                          f"ERROR: Invalid action in request {index}: "
                          f"{action}"
                      )
          else:
              action = data.get("action")

              if action not in allowed_actions:
                  raise SystemExit(
                      f"ERROR: Invalid user request action: {action}"
                  )

          print("User request JSON is valid.")
          print(f"Request format: {len(data.get('requests', [data]))} request(s).")
          PY

      # 3. Verify Repository Sync Token
      - name: Verify Sync Token
        env:
          SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SYNC_TOKEN}" ]]; then
            echo "::error::YODAWY_REPOSITORIES_SYNC_TOKEN is missing."
            exit 1
          fi

          echo "Repository sync token is available."

      # 4. Checkout Users Repository
      - name: Checkout Users Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_USERS_REPOSITORY
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          ref: main
          path: users
          persist-credentials: true

      # 5. Transfer User Request to Users Repository
      - name: Transfer User Request
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="NETWORK/user-request.json"
          DESTINATION_FILE="users/NETWORK/user-request.json"

          if [[ ! -f "${SOURCE_FILE}" ]]; then
            echo "::error::Source request file does not exist."
            exit 1
          fi

          mkdir -p "users/NETWORK"

          cp "${SOURCE_FILE}" "${DESTINATION_FILE}"

          if ! cmp -s "${SOURCE_FILE}" "${DESTINATION_FILE}"; then
            echo "::error::User request transfer verification failed."
            exit 1
          fi

          echo "User request transferred successfully:"
          echo "Dashboard: ${SOURCE_FILE}"
          echo "Users:     ${DESTINATION_FILE}"

      # 6. Commit and Push Request to Users Repository
      - name: Commit and Push User Request
        working-directory: users
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- NETWORK/user-request.json

          if git diff --cached --quiet; then
            echo "The request file is already up to date."
          else
            git commit -m "Sync user request from Dashboard"

            git push origin HEAD:main

            echo "User request pushed to Users Repository."
          fi

      # 7. Trigger Users Workflow
      - name: Dispatch USERS SYNC
        env:
          SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "${RESPONSE_FILE}"' EXIT

          HTTP_CODE="$(curl \
            --silent \
            --show-error \
            --output "${RESPONSE_FILE}" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SYNC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/m-saleh-yodawy/YODAWY_USERS_REPOSITORY/actions/workflows/users.yml/dispatches")"

          if [[ "${HTTP_CODE}" != "204" ]]; then
            echo "::error::Failed to dispatch USERS SYNC. HTTP ${HTTP_CODE}"

            if [[ -s "${RESPONSE_FILE}" ]]; then
              cat "${RESPONSE_FILE}"
            fi

            exit 1
          fi

          echo "USERS SYNC was dispatched successfully."
