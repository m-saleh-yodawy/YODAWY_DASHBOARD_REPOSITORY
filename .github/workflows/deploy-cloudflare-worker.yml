name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "CLOUDFLARE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global wrangler@4
      - name: Deploy Worker and static assets
        working-directory: CLOUDFLARE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e6a8f372ece7ccf9867091d9181934ea
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
          wrangler deploy --config wrangler.jsonc
