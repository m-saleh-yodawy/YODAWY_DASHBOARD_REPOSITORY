name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yodawy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global wrangler@4
      - name: Apply D1 migrations when D1 token is configured
        working-directory: CLOUDFLARE
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e6a8f372ece7ccf9867091d9181934ea
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_D1_API_TOKEN" ]; then
            echo "::warning::D1 migrations skipped. Add CLOUDFLARE_D1_API_TOKEN with D1 Edit permission."
            exit 0
          fi
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN"
          wrangler d1 migrations apply yodawy-dashboard --remote --config wrangler.jsonc
      - name: Deploy Worker and static assets
        working-directory: CLOUDFLARE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e6a8f372ece7ccf9867091d9181934ea
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
          wrangler deploy --config wrangler.jsonc
