name: DASHBOARD WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/users-dashboard-response-*.json"
      - "NETWORK/personal-dashboard-response-*.json"
      - "NETWORK/tools-dashboard-request-*.json"
      - "CONFIG/users.json"
      - "CONFIG/auth-users.json"
      - "CONFIG/tools-permissions.json"
      - "CONFIG/tools-visibility.json"
      - "TOOLS_CACHE/tools-manifest.json"
  repository_dispatch:
    types:
      - tools_dashboard_sync_requested
      - dashboard_response_received
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-central-main
  cancel-in-progress: false

jobs:
  sync-tools-cache:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'tools_dashboard_sync_requested') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER: m-saleh-yodawy
      TOOLS_REPO: YODAWY_TOOLS_REPOSITORY
      DASHBOARD_REPO: YODAWY_DASHBOARD_REPOSITORY
      BRANCH: main
      REQUEST_ID: ${{ github.event.client_payload.requestId || '' }}
      SEQUENCE: ${{ github.event.client_payload.sequence || '' }}

    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_DASHBOARD_REPOSITORY
          ref: main
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          path: dashboard
          fetch-depth: 1

      - name: Checkout Tools Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_TOOLS_REPOSITORY
          ref: main
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          path: tools-source
          fetch-depth: 1

      - name: Validate Request and Synchronize Tools Cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import re
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          DASHBOARD = ROOT / "dashboard"
          SOURCE = ROOT / "tools-source"
          SOURCE_TOOLS = SOURCE / "TOOLS"
          CATALOG_FILE = SOURCE / "CONFIG" / "tools.json"
          CACHE_ROOT = DASHBOARD / "TOOLS_CACHE"
          CACHE_TOOLS = CACHE_ROOT / "TOOLS"
          MANIFEST_FILE = CACHE_ROOT / "tools-manifest.json"
          NETWORK_DIR = DASHBOARD / "NETWORK"
          FAILED_DIR = NETWORK_DIR / "FAILED"
          LOGS_FILE = NETWORK_DIR / "network-logs.json"

          OWNER = os.environ["OWNER"]
          TOOLS_REPO = os.environ["TOOLS_REPO"]
          BRANCH = os.environ["BRANCH"]
          ENV_SEQ = os.environ.get("SEQUENCE", "").strip()
          ENV_REQ_ID = os.environ.get("REQUEST_ID", "").strip()
          MAX_REQUESTS = 50
          ACTIVE_STATES = {"SENT", "RECEIVED", "PROCESSING", "PROCESSED", "RESPONSE_SENT"}

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def default_logs():
              return {"protocolVersion": 1, "updatedAt": utc_now(), "transactions": {}}

          def default_manifest():
              return {"repository": f"{OWNER}/{TOOLS_REPO}", "branch": BRANCH, "sourceCatalog": "CONFIG/tools.json", "tools": []}

          def read_json(path, default=None):
              if not path.is_file():
                  return copy.deepcopy(default)
              raw = path.read_text(encoding="utf-8-sig").strip()
              if not raw:
                  return copy.deepcopy(default)
              try:
                  parsed = json.loads(raw)
                  return parsed if isinstance(parsed, dict) else copy.deepcopy(default)
              except Exception as err:
                  FAILED_DIR.mkdir(parents=True, exist_ok=True)
                  backup = FAILED_DIR / f"malformed-{path.name}-{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}.txt"
                  backup.write_text(raw, encoding="utf-8")
                  raise RuntimeError(f"Malformed JSON in {path}") from err

          def write_json(path, data, allow_empty=False):
              if not isinstance(data, dict) or (not data and not allow_empty):
                  raise ValueError(f"Invalid JSON payload for {path}")
              if path.is_file():
                  try:
                      if json.loads(path.read_text(encoding="utf-8-sig")) == data:
                          return
                  except Exception:
                      pass
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              tmp.replace(path)

          def compact_logs(doc, legacy_txs=None):
              txs = copy.deepcopy(doc.get("transactions")) if isinstance(doc.get("transactions"), dict) else {}
              if isinstance(legacy_txs, dict):
                  for k, v in legacy_txs.items():
                      if isinstance(v, dict):
                          txs.setdefault(k, v)
              active, terminal = {}, []
              for k, v in txs.items():
                  if not isinstance(v, dict):
                      continue
                  rid = str(v.get("requestId") or k).strip()
                  if not rid:
                      continue
                  st = str(v.get("status") or "COMPLETED").strip().upper()
                  c_at = str(v.get("createdAt") or v.get("updatedAt") or utc_now()).strip()
                  u_at = str(v.get("updatedAt") or v.get("completedAt") or v.get("processedAt") or c_at).strip()
                  actor_raw = v.get("actor")
                  actor_id = str(v.get("actorId") or (actor_raw.get("id") if isinstance(actor_raw, dict) else "SYSTEM") or "SYSTEM").strip().upper()
                  rec = {
                      "requestId": rid,
                      "sequence": str(v.get("sequence") or "001").strip(),
                      "requestType": str(v.get("requestType") or v.get("type") or "TOOLS_DASHBOARD_SYNC").strip(),
                      "action": str(v.get("action") or v.get("requestType") or "SYNC_TOOLS_MANIFEST").strip().upper(),
                      "status": st,
                      "actorId": actor_id,
                      "createdAt": c_at,
                      "updatedAt": u_at,
                  }
                  for opt in ("parentRequestId", "actorName", "summary", "targetId", "targetName", "targetRole", "targetToolId", "error", "cleanup"):
                      val = v.get(opt) or (v.get("lastError") if opt == "error" else (v.get("targetUserId") if opt == "targetId" else None))
                      if val:
                          rec[opt] = str(val).strip()[:240]
                  for opt in ("targetToolIds", "targetUserIds"):
                      values = v.get(opt)
                      if isinstance(values, list):
                          rec[opt] = list(dict.fromkeys(norm_id(value) for value in values if norm_id(value)))
                  if st in ACTIVE_STATES:
                      active[rid] = rec
                  else:
                      terminal.append((u_at, rid, rec))
              terminal.sort(key=lambda x: (x[0], x[1]))
              kept = {**active, **{rid: rec for _, rid, rec in terminal[-MAX_REQUESTS:]}}
              prev_txs = doc.get("transactions") if isinstance(doc.get("transactions"), dict) else {}
              u_ts = doc.get("updatedAt") if (prev_txs == kept and doc.get("updatedAt") and "auditLogs" not in doc) else utc_now()
              return {"protocolVersion": 1, "updatedAt": u_ts, "transactions": kept}

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1048576), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def read_meta(text, field):
              m = re.search(r"(?im)^\s*//\s*@" + re.escape(field) + r"\s+(.+?)\s*$", text)
              return m.group(1).strip() if m else ""

          NETWORK_DIR.mkdir(parents=True, exist_ok=True)
          FAILED_DIR.mkdir(parents=True, exist_ok=True)

          legacy_proc = read_json(NETWORK_DIR / "processed-transactions.json", {})
          raw_logs = read_json(LOGS_FILE, default_logs())
          logs_doc = compact_logs(raw_logs, legacy_proc.get("transactions") if isinstance(legacy_proc, dict) else None)

          for legacy_name in ("processed-transactions.json", "user-response.json", "request-logs.json", "requests-history.json"):
              lp = NETWORK_DIR / legacy_name
              if lp.is_file():
                  lp.unlink()

          if not MANIFEST_FILE.is_file() or not MANIFEST_FILE.read_text(encoding="utf-8-sig").strip():
              write_json(MANIFEST_FILE, default_manifest())

          txs = logs_doc["transactions"]
          candidates = []
          if ENV_SEQ and re.fullmatch(r"\d{3,}", ENV_SEQ):
              p = NETWORK_DIR / f"tools-dashboard-request-{ENV_SEQ}.json"
              if p.is_file():
                  candidates.append(p)
          for p in sorted(NETWORK_DIR.glob("tools-dashboard-request-*.json")):
              if p not in candidates:
                  candidates.append(p)

          changed_logs = ("auditLogs" in raw_logs) or bool(legacy_proc)
          for req_file in candidates:
              req_data = read_json(req_file, {})
              if not isinstance(req_data, dict) or not req_data:
                  continue
              if int(req_data.get("protocolVersion", 1)) != 1:
                  continue
              if str(req_data.get("requestType") or "").strip().upper() != "TOOLS_DASHBOARD_SYNC":
                  continue
              req_id = str(req_data.get("requestId") or ENV_REQ_ID or "").strip()
              m = re.search(r"-(\d{3,})\.json$", req_file.name)
              seq = str(req_data.get("sequence") or (m.group(1) if m else "001")).strip()
              if not req_id or txs.get(req_id, {}).get("status") in {"PROCESSED", "RESPONSE_SENT", "COMPLETED"}:
                  continue

              received_ts = utc_now()
              raw_actor = req_data.get("actor") if isinstance(req_data.get("actor"), dict) else {}
              actor_id = str(raw_actor.get("id") or raw_actor.get("userId") or "SYSTEM").strip().upper()
              receipt_file = NETWORK_DIR / f"tools-dashboard-receipt-{seq}.json"
              resp_file = NETWORK_DIR / f"dashboard-tools-response-{seq}.json"

              txs[req_id] = {
                  "requestId": req_id,
                  "sequence": seq,
                  "requestType": "TOOLS_DASHBOARD_SYNC",
                  "action": "SYNC_TOOLS_MANIFEST",
                  "status": "PROCESSING",
                  "actorId": actor_id,
                  "createdAt": str(req_data.get("createdAt") or received_ts),
                  "updatedAt": received_ts,
              }
              changed_logs = True

              summary = {"activeTools": 0, "copiedFiles": 0}
              status_val = "FAILED"
              msg = ""

              try:
                  write_json(receipt_file, {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "transactionId": req_id,
                      "sequence": seq,
                      "requestType": "TOOLS_DASHBOARD_SYNC",
                      "status": "RECEIVED",
                      "receivedAt": received_ts,
                  })

                  catalog = read_json(CATALOG_FILE, {"tools": []})
                  catalog_by_path = {}
                  for item in (catalog.get("tools", []) if isinstance(catalog, dict) else []):
                      if isinstance(item, dict):
                          t_path = str(item.get("path", "")).replace("\\", "/").strip()
                          if t_path.startswith("TOOLS/") and t_path.casefold().endswith(".js") and not t_path.casefold().endswith(".min.js"):
                              catalog_by_path[t_path.casefold()] = item

                  source_files = sorted(
                      (p for p in SOURCE_TOOLS.rglob("*") if p.is_file() and p.suffix.casefold() == ".js" and not p.name.casefold().endswith(".min.js")),
                      key=lambda p: p.as_posix().casefold(),
                  ) if SOURCE_TOOLS.is_dir() else []

                  source_by_path = {sf.relative_to(SOURCE).as_posix().casefold(): sf for sf in source_files}
                  active_tools = []
                  for key, item in catalog_by_path.items():
                      if str(item.get("status", "Active")).strip().casefold() == "active":
                          if key not in source_by_path:
                              raise RuntimeError(f"Missing active tool file: {item.get('path')}")
                          active_tools.append((key, item, source_by_path[key]))

                  active_tools.sort(key=lambda x: int(str(x[1].get("id", "TOOL-0")).split("-")[1]) if re.fullmatch(r"TOOL-\d+", str(x[1].get("id", ""))) else 0)

                  manifest_tools = []
                  files_to_copy = []
                  for _, item, sf in active_tools:
                      text = sf.read_text(encoding="utf-8", errors="replace")
                      rel = sf.relative_to(SOURCE_TOOLS).as_posix()
                      cached_path = (Path("TOOLS_CACHE") / "TOOLS" / rel).as_posix()
                      tid = str(item.get("id", "")).strip()
                      manifest_tools.append({
                          "id": tid,
                          "name": str(item.get("name", "")).strip() or read_meta(text, "name") or sf.stem,
                          "description": str(item.get("description", "")).strip() or read_meta(text, "description"),
                          "version": str(item.get("version", "")).strip() or read_meta(text, "version"),
                          "author": read_meta(text, "author"),
                          "path": cached_path,
                          "file": sf.name,
                          "sha256": sha256_file(sf),
                      })
                      files_to_copy.append((sf, rel))

                  CACHE_ROOT.mkdir(parents=True, exist_ok=True)
                  tmp_cache = CACHE_ROOT / "TOOLS.tmp"
                  old_cache = CACHE_ROOT / "TOOLS.old"
                  if tmp_cache.exists():
                      shutil.rmtree(tmp_cache)
                  tmp_cache.mkdir(parents=True, exist_ok=True)

                  for sf, rel in files_to_copy:
                      dest = tmp_cache / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(sf, dest)

                  write_json(MANIFEST_FILE, {
                      "repository": f"{OWNER}/{TOOLS_REPO}",
                      "branch": BRANCH,
                      "sourceCatalog": "CONFIG/tools.json",
                      "tools": manifest_tools,
                  })

                  if old_cache.exists():
                      shutil.rmtree(old_cache)
                  if CACHE_TOOLS.exists():
                      CACHE_TOOLS.rename(old_cache)
                  tmp_cache.rename(CACHE_TOOLS)
                  if old_cache.exists():
                      shutil.rmtree(old_cache)

                  summary["activeTools"] = len(manifest_tools)
                  summary["copiedFiles"] = len(files_to_copy)
                  status_val = "COMPLETED"
                  msg = "Tools synchronization completed successfully."
              except Exception as err:
                  status_val = "FAILED"
                  msg = str(err)
                  write_json(FAILED_DIR / f"{req_id}.json", {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "sequence": seq,
                      "status": "FAILED",
                      "error": msg,
                      "failedAt": utc_now(),
                  })
                  raise
              finally:
                  ts = utc_now()
                  write_json(receipt_file, {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "transactionId": req_id,
                      "sequence": seq,
                      "requestType": "TOOLS_DASHBOARD_SYNC",
                      "status": "PROCESSED" if status_val == "COMPLETED" else "FAILED",
                      "processedAt": ts,
                      "summary": summary,
                  })
                  write_json(resp_file, {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "transactionId": req_id,
                      "sequence": seq,
                      "requestType": "TOOLS_DASHBOARD_SYNC",
                      "status": status_val,
                      "completedAt": ts,
                      "message": msg,
                      "summary": summary,
                  })
                  txs[req_id].update({
                      "status": "RESPONSE_SENT" if status_val == "COMPLETED" else "FAILED",
                      "updatedAt": ts,
                  })
                  if status_val != "COMPLETED":
                      txs[req_id]["error"] = msg
                  write_json(LOGS_FILE, compact_logs(logs_doc))

          if changed_logs or not LOGS_FILE.is_file():
              write_json(LOGS_FILE, compact_logs(logs_doc))
          PY

      - name: Commit Dashboard Tools Sync Result
        if: always()
        working-directory: dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A TOOLS_CACHE NETWORK
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync Dashboard tools cache and network-logs [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1

  process-dashboard-responses:
    needs: [sync-tools-cache]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER: m-saleh-yodawy
      DASHBOARD_REPO: YODAWY_DASHBOARD_REPOSITORY
      USERS_REPO: YODAWY_USERS_REPOSITORY
      TOOLS_REPO: YODAWY_TOOLS_REPOSITORY
      BRANCH: main
      SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}

    steps:
      - name: Process Responses and Reconcile Dashboard Configs Atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import copy
          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          OWNER = os.environ["OWNER"]
          DASHBOARD_REPO = os.environ["DASHBOARD_REPO"]
          USERS_REPO = os.environ["USERS_REPO"]
          TOOLS_REPO = os.environ["TOOLS_REPO"]
          BRANCH = os.environ["BRANCH"]
          TOKEN = os.environ.get("SYNC_TOKEN", "").strip()
          API = "https://api.github.com"
          MAX_REQUESTS = 50
          ACTIVE_STATES = {"SENT", "RECEIVED", "PROCESSING", "PROCESSED", "RESPONSE_SENT"}
          VALID_VISIBILITY_MODES = {"PRIVATE", "PUBLIC", "SELECTED_USERS"}

          USERS_PATH = "CONFIG/users.json"
          LEGACY_USERS_PATH = "CONFIG/auth-users.json"
          PERMISSIONS_PATH = "CONFIG/tools-permissions.json"
          VISIBILITY_PATH = "CONFIG/tools-visibility.json"
          MANIFEST_PATH = "TOOLS_CACHE/tools-manifest.json"
          LOGS_PATH = "NETWORK/network-logs.json"

          if not TOKEN:
              raise RuntimeError("Missing YODAWY_REPOSITORIES_SYNC_TOKEN")

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "Yodawy-Dashboard-Central-Processor",
          }

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def default_logs():
              return {"protocolVersion": 1, "updatedAt": utc_now(), "transactions": {}}

          def default_manifest():
              return {"repository": f"{OWNER}/{TOOLS_REPO}", "branch": BRANCH, "sourceCatalog": "CONFIG/tools.json", "tools": []}

          def api_req(method, endpoint, body=None, allow_404=False):
              data = json.dumps(body, ensure_ascii=False).encode("utf-8") if body is not None else None
              for attempt in range(1, 6):
                  req = urllib.request.Request(API + endpoint, data=data, headers=HEADERS, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          raw = resp.read().decode("utf-8")
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as err:
                      if allow_404 and err.code == 404:
                          return None
                      detail = err.read().decode("utf-8", errors="replace")
                      if err.code in {429, 500, 502, 503, 504} and attempt < 5:
                          time.sleep(attempt * 2 + random.uniform(0.1, 1.0))
                          continue
                      raise RuntimeError(f"HTTP {err.code} on {method} {endpoint}: {detail}") from err
                  except urllib.error.URLError as err:
                      if attempt < 5:
                          time.sleep(attempt * 2)
                          continue
                      raise RuntimeError(f"Network error on {endpoint}: {err}") from err

          def read_json(repo, path, default=None):
              url = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}?ref={BRANCH}"
              res = api_req("GET", url, allow_404=True)
              if not res or not isinstance(res.get("content"), str):
                  return copy.deepcopy(default), None, False
              raw = base64.b64decode(res["content"]).decode("utf-8-sig").strip()
              if not raw:
                  return copy.deepcopy(default), res.get("sha"), True
              parsed = json.loads(raw)
              return (parsed if isinstance(parsed, dict) else copy.deepcopy(default)), res.get("sha"), False

          def write_json(repo, path, data, msg, allow_empty=False):
              if not isinstance(data, dict) or (not data and not allow_empty):
                  raise ValueError(f"Refusing to write invalid JSON to {repo}/{path}")
              content = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
              url = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 7):
                  cur, sha, is_empty_raw = read_json(repo, path, default=None)
                  if cur == data and sha is not None and not is_empty_raw:
                      return
                  payload = {"message": f"{msg} [skip ci]", "content": encoded, "branch": BRANCH}
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", url, payload)
                      return
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def mutate_json(repo, path, default, mutator, msg, allow_empty=False):
              url = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 7):
                  cur, sha, is_empty_raw = read_json(repo, path, default)
                  if not isinstance(cur, dict):
                      cur = copy.deepcopy(default)
                  updated = mutator(copy.deepcopy(cur))
                  if not isinstance(updated, dict) or (not updated and not allow_empty):
                      raise ValueError(f"Mutator produced invalid schema for {repo}/{path}")
                  if updated == cur and sha is not None and not is_empty_raw:
                      return updated
                  content = json.dumps(updated, ensure_ascii=False, indent=2) + "\n"
                  payload = {
                      "message": f"{msg} [skip ci]",
                      "content": base64.b64encode(content.encode("utf-8")).decode("ascii"),
                      "branch": BRANCH,
                  }
                  if sha:
                      payload["sha"] = sha
                  try:
                      api_req("PUT", url, payload)
                      return updated
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 6:
                          time.sleep(attempt * 1.5 + random.uniform(0.1, 0.5))
                          continue
                      raise

          def cleanup_file(repo, path, req_id, msg):
              if path == LOGS_PATH or path.startswith("NETWORK/FAILED/"):
                  return "SKIPPED_PROTECTED"
              url = f"/repos/{OWNER}/{repo}/contents/{urllib.parse.quote(path, safe='/')}"
              for attempt in range(1, 5):
                  doc, sha, _ = read_json(repo, path, default=None)
                  if not sha:
                      return "ALREADY_DELETED"
                  if req_id and isinstance(doc, dict):
                      file_req_id = str(doc.get("requestId") or "").strip()
                      if file_req_id and file_req_id != req_id:
                          return "SKIPPED_OTHER_TRANSACTION"
                  try:
                      api_req("DELETE", url, {"message": f"{msg} [skip ci]", "sha": sha, "branch": BRANCH})
                      return "DELETED"
                  except RuntimeError as err:
                      if ("HTTP 409" in str(err) or "HTTP 422" in str(err)) and attempt < 4:
                          time.sleep(attempt * 1.5)
                          continue
                      if "HTTP 404" in str(err):
                          return "ALREADY_DELETED"
                      return "API_FAILURE"
              return "API_FAILURE"

          def list_network_files(repo):
              res = api_req("GET", f"/repos/{OWNER}/{repo}/contents/NETWORK?ref={BRANCH}", allow_404=True)
              return sorted(str(i.get("name", "")) for i in res if isinstance(i, dict)) if isinstance(res, list) else []

          def norm_id(val):
              return str(val or "").strip().upper()

          def norm_role(val):
              r = re.sub(r"[\s_-]+", "_", str(val or "USER").strip().upper())
              r = "SUPER_ADMIN" if r == "SUPERADMIN" else r
              return r if r in {"SUPER_ADMIN", "ADMIN", "USER", "SYSTEM", "UNKNOWN"} else "UNKNOWN"

          def norm_action(action):
              act = str(action or "").strip().upper()
              mapping = {
                  "EDIT_USER": "UPDATE_USER",
                  "CHANGE_USER_ROLE": "UPDATE_USER",
                  "CHANGE_USER_STATUS": "UPDATE_USER",
                  "UPDATE_SETTINGS": "UPDATE_DASHBOARD_SETTINGS",
                  "TOOLS_DASHBOARD_SYNC": "SYNC_TOOLS_MANIFEST",
                  "PERSONAL_TOOLS_SYNC": "SYNC_PERSONAL_TOOLS",
              }
              return mapping.get(act, act or "SYNC_USERS")

          def compact_logs(doc):
              txs = copy.deepcopy(doc.get("transactions")) if isinstance(doc.get("transactions"), dict) else {}
              active, terminal = {}, []
              for k, v in txs.items():
                  if not isinstance(v, dict):
                      continue
                  rid = str(v.get("requestId") or k).strip()
                  if not rid:
                      continue
                  st = str(v.get("status") or "COMPLETED").strip().upper()
                  c_at = str(v.get("createdAt") or v.get("updatedAt") or utc_now()).strip()
                  u_at = str(v.get("updatedAt") or v.get("completedAt") or v.get("processedAt") or c_at).strip()
                  actor_raw = v.get("actor")
                  actor_id = str(v.get("actorId") or (actor_raw.get("id") if isinstance(actor_raw, dict) else "SYSTEM") or "SYSTEM").strip().upper()
                  rec = {
                      "requestId": rid,
                      "sequence": str(v.get("sequence") or "001").strip(),
                      "requestType": str(v.get("requestType") or v.get("type") or "DASHBOARD_USERS_SYNC").strip(),
                      "action": norm_action(v.get("action") or v.get("requestType")),
                      "status": st,
                      "actorId": actor_id,
                      "createdAt": c_at,
                      "updatedAt": u_at,
                  }
                  for opt in ("parentRequestId", "targetId", "error", "cleanup"):
                      val = v.get(opt) or (v.get("lastError") if opt == "error" else (v.get("targetUserId") if opt == "targetId" else None))
                      if val:
                          rec[opt] = str(val).strip()
                  if st in ACTIVE_STATES:
                      active[rid] = rec
                  else:
                      terminal.append((u_at, rid, rec))
              terminal.sort(key=lambda x: (x[0], x[1]))
              kept = {**active, **{rid: rec for _, rid, rec in terminal[-MAX_REQUESTS:]}}
              prev_txs = doc.get("transactions") if isinstance(doc.get("transactions"), dict) else {}
              u_ts = doc.get("updatedAt") if (prev_txs == kept and doc.get("updatedAt") and "auditLogs" not in doc) else utc_now()
              return {"protocolVersion": 1, "updatedAt": u_ts, "transactions": kept}

          def record_tx(repo, tx_id, tx_updates):
              def _mut(doc):
                  txs = doc.setdefault("transactions", {})
                  tx = txs.setdefault(tx_id, {"requestId": tx_id, "createdAt": utc_now()})
                  tx.update(tx_updates)
                  return compact_logs(doc)
              return mutate_json(repo, LOGS_PATH, default_logs(), _mut, f"Update log {tx_id}")

          legacy_users_doc, legacy_users_sha, _ = read_json(DASHBOARD_REPO, LEGACY_USERS_PATH, {"users": []})
          cur_users_doc, cur_users_sha, cur_users_empty = read_json(DASHBOARD_REPO, USERS_PATH, {"users": []})

          if cur_users_sha is None or cur_users_empty or not (cur_users_doc or {}).get("users"):
              seed_users = (legacy_users_doc or {}).get("users", [])
              if not seed_users:
                  u_canon, _, _ = read_json(USERS_REPO, USERS_PATH, {"users": []})
                  seed_users = (u_canon or {}).get("users", [])
              write_json(DASHBOARD_REPO, USERS_PATH, {"users": seed_users if isinstance(seed_users, list) else []}, "Initialize canonical CONFIG/users.json")

          if legacy_users_sha is not None:
              cleanup_file(DASHBOARD_REPO, LEGACY_USERS_PATH, "", "Remove migrated legacy CONFIG/auth-users.json")

          for cfg_path, cfg_def, allow_emp in (
              (USERS_PATH, {"users": []}, False),
              (PERMISSIONS_PATH, {}, True),
              (VISIBILITY_PATH, {}, True),
              (MANIFEST_PATH, default_manifest(), False),
              (LOGS_PATH, default_logs(), False),
          ):
              _, sha_c, is_empty_c = read_json(DASHBOARD_REPO, cfg_path, cfg_def)
              if sha_c is None or is_empty_c:
                  write_json(DASHBOARD_REPO, cfg_path, cfg_def, f"Initialize canonical {cfg_path}", allow_empty=allow_emp)

          manifest, _, _ = read_json(DASHBOARD_REPO, MANIFEST_PATH, default_manifest())
          tool_ids = [
              str(t.get("id")).strip()
              for t in (manifest.get("tools", []) if isinstance(manifest, dict) else [])
              if isinstance(t, dict) and str(t.get("id") or "").strip()
          ]

          net_names = list_network_files(DASHBOARD_REPO)
          users_resp_files = [f"NETWORK/{n}" for n in net_names if re.fullmatch(r"users-dashboard-response-\d{3,}\.json", n)]
          personal_resp_files = [f"NETWORK/{n}" for n in net_names if re.fullmatch(r"personal-dashboard-response-\d{3,}\.json", n)]

          for resp_path in users_resp_files:
              resp, _, _ = read_json(DASHBOARD_REPO, resp_path, {})
              if not isinstance(resp, dict) or not resp or int(resp.get("protocolVersion", 1)) != 1:
                  continue
              req_id = str(resp.get("requestId") or "").strip()
              seq_m = re.search(r"-(\d{3,})\.json$", resp_path)
              seq = str(resp.get("sequence") or (seq_m.group(1) if seq_m else "001")).strip()
              status = str(resp.get("status") or "").strip().upper()
              req_type = str(resp.get("requestType") or "DASHBOARD_USERS_SYNC").strip().upper()

              if not req_id or req_id.startswith("TOOLS-") or req_type not in {"DASHBOARD_USERS_SYNC", "USERS_DASHBOARD_SYNC"}:
                  cleanup_file(DASHBOARD_REPO, resp_path, "", f"Remove misrouted response {seq}")
                  continue

              logs_now, _, _ = read_json(DASHBOARD_REPO, LOGS_PATH, default_logs())
              if (logs_now.get("transactions") or {}).get(req_id, {}).get("status") == "COMPLETED":
                  cleanup_file(DASHBOARD_REPO, resp_path, req_id, f"Cleanup completed response {req_id}")
                  cleanup_file(DASHBOARD_REPO, f"NETWORK/dashboard-users-request-{seq}.json", req_id, f"Cleanup completed request {req_id}")
                  continue

              req_path = f"NETWORK/dashboard-users-request-{seq}.json"
              orig_req, _, _ = read_json(DASHBOARD_REPO, req_path, {})
              if req_type != "USERS_DASHBOARD_SYNC" and status not in {"REJECTED", "FAILED", "ERROR"}:
                  if not isinstance(orig_req, dict) or str(orig_req.get("requestId") or "").strip() != req_id or str(orig_req.get("sequence") or seq).strip() != seq:
                      write_json(DASHBOARD_REPO, f"NETWORK/FAILED/{req_id}.json", {
                          "protocolVersion": 1,
                          "requestId": req_id,
                          "sequence": seq,
                          "status": "FAILED",
                          "error": "Missing or mismatched original dashboard-users-request",
                          "failedAt": utc_now(),
                      }, f"Preserve mismatched response {req_id}")
                      continue

              raw_actor = (orig_req.get("actor") if isinstance(orig_req, dict) else None) or resp.get("actor") or {}
              actor_id = norm_id(raw_actor.get("id") or raw_actor.get("userId") if isinstance(raw_actor, dict) else "SYSTEM") or "SYSTEM"
              actor_name = " ".join(str(raw_actor.get("name") or raw_actor.get("username") or actor_id).split()) if isinstance(raw_actor, dict) else actor_id
              canon_action = norm_action(resp.get("action") or (orig_req.get("action") if isinstance(orig_req, dict) else "") or "SYNC_USERS")
              ts_recv = utc_now()

              if status in {"FAILED", "REJECTED", "ERROR"}:
                  err_detail = str(resp.get("error") or resp.get("message") or "Users operation failed")
                  write_json(DASHBOARD_REPO, f"NETWORK/FAILED/{req_id}.json", {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "sequence": seq,
                      "status": status if status in {"FAILED", "REJECTED"} else "FAILED",
                      "error": err_detail,
                      "failedAt": ts_recv,
                  }, f"Preserve failed users transaction {req_id}")
                  record_tx(DASHBOARD_REPO, req_id, {
                      "sequence": seq,
                      "requestType": req_type,
                      "action": canon_action,
                      "status": status if status in {"FAILED", "REJECTED"} else "FAILED",
                      "actorId": actor_id,
                      "actorName": actor_name,
                      "updatedAt": ts_recv,
                      "error": err_detail,
                  })
                  cleanup_file(DASHBOARD_REPO, resp_path, req_id, f"Cleanup failed response {req_id}")
                  cleanup_file(DASHBOARD_REPO, req_path, req_id, f"Cleanup failed request {req_id}")
                  cleanup_file(USERS_REPO, f"NETWORK/dashboard-users-request-{seq}.json", req_id, f"Cleanup target request {req_id}")
                  cleanup_file(USERS_REPO, f"NETWORK/users-dashboard-response-{seq}.json", req_id, f"Cleanup target response {req_id}")
                  continue

              if status in {"SUCCESS", "COMPLETED"}:
                  inc_users = resp.get("users")
                  if isinstance(inc_users, list):
                      mutate_json(DASHBOARD_REPO, USERS_PATH, {"users": []}, lambda _: {"users": inc_users}, f"Sync users.json from {req_id}")
                  if isinstance(resp.get("permissions"), dict):
                      clean_inc_perms = {
                          uid: {tid: tv for tid, tv in u_map.items() if (not tool_ids or tid in tool_ids) and isinstance(tv, dict)}
                          for uid, u_map in resp["permissions"].items()
                          if isinstance(u_map, dict)
                      }
                      clean_inc_perms = {uid: u_map for uid, u_map in clean_inc_perms.items() if u_map}
                      if clean_inc_perms:
                          mutate_json(DASHBOARD_REPO, PERMISSIONS_PATH, {}, lambda p: {**(p or {}), **clean_inc_perms}, f"Update permissions from {req_id}", allow_empty=True)
                  if isinstance(resp.get("visibility"), dict):
                      clean_inc_vis = {
                          tid: {
                              "visibility": str(v_map.get("visibility", "PRIVATE")).strip().upper(),
                              "allowedUsers": list(v_map.get("allowedUsers", [])) if isinstance(v_map.get("allowedUsers"), list) else [],
                          }
                          for tid, v_map in resp["visibility"].items()
                          if (not tool_ids or tid in tool_ids) and isinstance(v_map, dict)
                      }
                      if clean_inc_vis:
                          mutate_json(DASHBOARD_REPO, VISIBILITY_PATH, {}, lambda v: {**(v or {}), **clean_inc_vis}, f"Update visibility from {req_id}", allow_empty=True)

                  c_res = [
                      cleanup_file(DASHBOARD_REPO, resp_path, req_id, f"Cleanup response {req_id}"),
                      cleanup_file(DASHBOARD_REPO, req_path, req_id, f"Cleanup request {req_id}"),
                      cleanup_file(USERS_REPO, f"NETWORK/dashboard-users-request-{seq}.json", req_id, f"Cleanup target request {req_id}"),
                      cleanup_file(USERS_REPO, f"NETWORK/dashboard-users-receipt-{seq}.json", req_id, f"Cleanup target receipt {req_id}"),
                      cleanup_file(USERS_REPO, f"NETWORK/users-dashboard-response-{seq}.json", req_id, f"Cleanup target response {req_id}"),
                  ]
                  cleanup_state = "DONE" if all(r in {"DELETED", "ALREADY_DELETED"} for r in c_res) else "PENDING"
                  ts_done = utc_now()
                  tx_done = {
                      "sequence": seq,
                      "requestType": req_type,
                      "action": canon_action,
                      "status": "COMPLETED",
                      "actorId": actor_id,
                      "actorName": actor_name,
                      "updatedAt": ts_done,
                  }
                  if cleanup_state == "PENDING":
                      tx_done["cleanup"] = "PENDING"
                  record_tx(DASHBOARD_REPO, req_id, tx_done)
                  record_tx(USERS_REPO, req_id, tx_done)

          current_users_doc, _, _ = read_json(DASHBOARD_REPO, USERS_PATH, {"users": []})
          current_users_list = current_users_doc.get("users", []) if isinstance(current_users_doc, dict) else []

          for resp_path in personal_resp_files:
              resp, _, _ = read_json(DASHBOARD_REPO, resp_path, {})
              if not isinstance(resp, dict) or not resp or int(resp.get("protocolVersion", 1)) != 1:
                  continue
              req_id = str(resp.get("requestId") or "").strip()
              seq_m = re.search(r"-(\d{3,})\.json$", resp_path)
              seq = str(resp.get("sequence") or (seq_m.group(1) if seq_m else "001")).strip()
              status = str(resp.get("status") or "").strip().upper()
              req_path = f"NETWORK/dashboard-personal-request-{seq}.json"
              if not req_id:
                  continue

              orig_req, _, _ = read_json(DASHBOARD_REPO, req_path, {})
              if not isinstance(orig_req, dict) or str(orig_req.get("requestId") or "").strip() != req_id:
                  write_json(DASHBOARD_REPO, f"NETWORK/FAILED/{req_id}.json", {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "sequence": seq,
                      "status": "FAILED",
                      "error": "Missing or mismatched original dashboard-personal-request",
                      "failedAt": utc_now(),
                  }, f"Preserve invalid personal response {req_id}")
                  continue

              payload = orig_req.get("payload") if isinstance(orig_req.get("payload"), dict) else {}
              raw_actor = orig_req.get("actor") if isinstance(orig_req.get("actor"), dict) else {}
              actor_id = norm_id(raw_actor.get("id") or raw_actor.get("userId") or orig_req.get("userId")) or "UNKNOWN"
              canon_action = norm_action(payload.get("action") or orig_req.get("requestType") or "UPDATE_DASHBOARD_SETTINGS")
              ts_now = utc_now()

              if status in {"REJECTED", "FAILED", "ERROR"}:
                  err_detail = str(resp.get("details") or "Personal operation rejected")
                  write_json(DASHBOARD_REPO, f"NETWORK/FAILED/{req_id}.json", {
                      "protocolVersion": 1,
                      "requestId": req_id,
                      "sequence": seq,
                      "status": status if status in {"FAILED", "REJECTED"} else "FAILED",
                      "error": err_detail,
                      "failedAt": ts_now,
                  }, f"Preserve failed personal transaction {req_id}")
                  record_tx(DASHBOARD_REPO, req_id, {
                      "sequence": seq,
                      "requestType": "DASHBOARD_PERSONAL_SYNC",
                      "action": canon_action,
                      "status": status if status in {"FAILED", "REJECTED"} else "FAILED",
                      "actorId": actor_id,
                      "updatedAt": ts_now,
                      "error": err_detail,
                  })
                  cleanup_file(DASHBOARD_REPO, resp_path, req_id, f"Cleanup failed personal response {req_id}")
                  cleanup_file(DASHBOARD_REPO, req_path, req_id, f"Cleanup failed personal request {req_id}")
                  continue

              c_res = [
                  cleanup_file(DASHBOARD_REPO, resp_path, req_id, f"Cleanup personal response {req_id}"),
                  cleanup_file(DASHBOARD_REPO, req_path, req_id, f"Cleanup personal request {req_id}"),
              ]
              tx_upd = {
                  "sequence": seq,
                  "requestType": "DASHBOARD_PERSONAL_SYNC",
                  "action": canon_action,
                  "status": "COMPLETED",
                  "actorId": actor_id,
                  "updatedAt": ts_now,
              }
              if not all(r in {"DELETED", "ALREADY_DELETED"} for r in c_res):
                  tx_upd["cleanup"] = "PENDING"
              record_tx(DASHBOARD_REPO, req_id, tx_upd)

          active_ids = {
              norm_id(u.get("id"))
              for u in current_users_list
              if isinstance(u, dict) and norm_id(u.get("id")) and str(u.get("status", "Active")).strip().casefold() == "active"
          }

          def _reconcile_vis(visibility):
              visibility = visibility if isinstance(visibility, dict) else {}
              if not tool_ids:
                  return {}
              out = {}
              for tid in tool_ids:
                  ex = visibility.get(tid)
                  if not isinstance(ex, dict):
                      out[tid] = {
                          "visibility": "PRIVATE",
                          "allowedUsers": [],
                      }
                  else:
                      vis_mode = str(ex.get("visibility") or "PRIVATE").strip().upper()
                      if vis_mode not in VALID_VISIBILITY_MODES:
                          vis_mode = "PRIVATE"
                      allowed = ex.get("allowedUsers", [])
                      out[tid] = {
                          "visibility": vis_mode,
                          "allowedUsers": list(dict.fromkeys(norm_id(uid) for uid in (allowed if isinstance(allowed, list) else []) if norm_id(uid) in active_ids)) if vis_mode == "SELECTED_USERS" else [],
                      }
              return out

          mutate_json(DASHBOARD_REPO, VISIBILITY_PATH, {}, _reconcile_vis, "Reconcile dashboard tools visibility", allow_empty=True)

          def _reconcile_perms(permissions):
              permissions = permissions if isinstance(permissions, dict) else {}
              if not tool_ids or not current_users_list:
                  return {}
              out = {}
              for u in current_users_list:
                  if not isinstance(u, dict):
                      continue
                  uid = norm_id(u.get("id"))
                  role = norm_role(u.get("role") or u.get("ROLE"))
                  if not uid or uid not in active_ids or role not in {"ADMIN", "USER"}:
                      continue
                  u_perms = permissions.get(uid) if isinstance(permissions.get(uid), dict) else {}
                  new_u_perms = {}
                  for tid in tool_ids:
                      cur = u_perms.get(tid)
                      if not isinstance(cur, dict):
                          new_u_perms[tid] = {"granted": False, "forcedState": False, "type": "ADMIN"}
                      else:
                          forced = bool(cur.get("forcedState", False))
                          granted = bool(cur.get("granted", False))
                          p_type = "SUPER_ADMIN" if (forced or str(cur.get("type", "")).upper() == "SUPER_ADMIN") else "ADMIN"
                          new_u_perms[tid] = {
                              "granted": granted,
                              "forcedState": forced,
                              "type": p_type,
                          }
                  out[uid] = new_u_perms
              return out

          mutate_json(DASHBOARD_REPO, PERMISSIONS_PATH, {}, _reconcile_perms, "Reconcile dashboard tools permissions", allow_empty=True)
          PY
