name: DASHBOARD WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/user-response.json"
      - "CONFIG/auth-users.json"
      - "CONFIG/tools-permissions.json"
      - "CONFIG/tools-visibility.json"
      - "TOOLS_CACHE/tools-manifest.json"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-bootstrap-main
  cancel-in-progress: false

jobs:
  initialize-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Process User Response & Initialize Dashboard Data
        id: initialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          request_path = Path("NETWORK/user-request.json")
          response_path = Path("NETWORK/user-response.json")
          users_path = Path("CONFIG/auth-users.json")
          permissions_path = Path("CONFIG/tools-permissions.json")
          visibility_path = Path("CONFIG/tools-visibility.json")
          manifest_path = Path("TOOLS_CACHE/tools-manifest.json")

          def read_json(path, default):
              if not path.is_file():
                  return default
              text = path.read_text(encoding="utf-8-sig").strip()
              return json.loads(text) if text else default

          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              output = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              old = path.read_text(encoding="utf-8-sig") if path.is_file() else ""
              if old != output:
                  path.write_text(output, encoding="utf-8")

          response_data = read_json(response_path, {})
          users_data = read_json(users_path, {"users": []})
          if not isinstance(users_data, dict):
              raise SystemExit(1)

          users = users_data.get("users", [])
          if not isinstance(users, list):
              raise SystemExit(1)

          if isinstance(response_data, dict) and response_data.get("status") == "SUCCESS":
              if isinstance(response_data.get("users"), list):
                  users = response_data["users"]
              elif isinstance(response_data.get("user"), dict):
                  u = response_data["user"]
                  uid = str(u.get("id") or "").strip().upper()
                  if uid:
                      idx = next((i for i, item in enumerate(users) if str(item.get("id") or "").strip().upper() == uid), None)
                      if idx is not None:
                          users[idx] = u
                      else:
                          users.append(u)
              users_data["users"] = users
              write_json(users_path, users_data)

          seen_users = set()
          active_ids = set()

          for user in users:
              if not isinstance(user, dict):
                  raise SystemExit(1)
              uid = str(user.get("id") or "").strip().upper()
              if not uid:
                  if not str(user.get("name") or "").strip():
                      raise SystemExit(1)
                  continue
              if uid in seen_users:
                  raise SystemExit(1)
              seen_users.add(uid)
              if str(user.get("status", "Active")).strip().lower() == "active":
                  active_ids.add(uid)

          permissions = read_json(permissions_path, {})
          visibility = read_json(visibility_path, {})
          if not isinstance(permissions, dict) or not isinstance(visibility, dict):
              raise SystemExit(1)

          tool_ids = []
          if manifest_path.is_file():
              manifest = read_json(manifest_path, None)
              tools = manifest if isinstance(manifest, list) else (manifest.get("tools", []) if isinstance(manifest, dict) else [])
              if isinstance(tools, list):
                  for tool in tools:
                      if isinstance(tool, dict):
                          tid = str(tool.get("id") or tool.get("toolId") or tool.get("tool_id") or "").strip()
                          if tid and tid not in tool_ids:
                              tool_ids.append(tid)

          for tid in list(visibility.keys()):
              if tid not in tool_ids:
                  tool_ids.append(tid)
          for rec in permissions.values():
              if isinstance(rec, dict):
                  for tid in rec.keys():
                      if tid not in tool_ids:
                          tool_ids.append(tid)

          for user in users:
              uid = str(user.get("id") or "").strip().upper()
              if not uid or uid not in active_ids:
                  continue
              raw_role = user.get("role") or user.get("ROLE") or "USER"
              role = re.sub(r"[\s\-_]+", "_", str(raw_role).strip().upper())
              if role == "SUPERADMIN":
                  role = "SUPER_ADMIN"
              is_super_admin = role == "SUPER_ADMIN"
              role_type = role if role in ("SUPER_ADMIN", "ADMIN", "USER") else "USER"

              user_permissions = permissions.get(uid)
              if not isinstance(user_permissions, dict):
                  user_permissions = {}
                  permissions[uid] = user_permissions

              for tid in tool_ids:
                  if tid not in user_permissions or not isinstance(user_permissions[tid], dict):
                      user_permissions[tid] = {
                          "granted": is_super_admin,
                          "type": role_type,
                      }
                  else:
                      user_permissions[tid]["granted"] = bool(user_permissions[tid].get("granted", False))
                      user_permissions[tid]["type"] = role_type

          for uid in list(permissions.keys()):
              if uid not in active_ids:
                  permissions.pop(uid, None)

          for tid in tool_ids:
              existing = visibility.get(tid)
              if not isinstance(existing, dict):
                  visibility[tid] = {
                      "visibility": "SUPER_ADMIN",
                      "allowedUsers": [],
                      "developmentStatus": "UNDER DEVELOPMENT",
                      "publicationStatus": "NOT PUBLISHED",
                      "enabled": False,
                  }
              else:
                  existing.setdefault("visibility", "SUPER_ADMIN")
                  allowed = existing.get("allowedUsers", [])
                  existing["allowedUsers"] = [
                      str(u).strip() for u in (allowed if isinstance(allowed, list) else [])
                      if str(u).strip() in active_ids
                  ]
                  existing.setdefault("developmentStatus", "UNDER DEVELOPMENT")
                  existing.setdefault("publicationStatus", "NOT PUBLISHED")
                  existing.setdefault("enabled", False)

          write_json(permissions_path, permissions)
          write_json(visibility_path, visibility)
          write_json(response_path, {})
          write_json(request_path, {})
          PY

      - name: Commit Synchronized Dashboard Data & Clear Network Files
        if: steps.initialize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            CONFIG/auth-users.json \
            CONFIG/tools-permissions.json \
            CONFIG/tools-visibility.json \
            NETWORK/user-request.json \
            NETWORK/user-response.json

          if ! git diff --cached --quiet; then
            git commit -m "Synchronize dashboard data and clear network files [skip ci]"
            git push origin HEAD:main
          fi
