name: DASHBOARD WORKFLOW

on:
  push:
    branches:
      - main
    paths:
      - "NETWORK/user-response.json"
      - "NETWORK/dashboard-response*.json"
      - "NETWORK/*-response-receiptor*.json"
      - "CONFIG/auth-users.json"
      - "CONFIG/tools-permissions.json"
      - "CONFIG/tools-visibility.json"
      - "TOOLS_CACHE/tools-manifest.json"
  repository_dispatch:
    types:
      - tools_dashboard_sync_requested
      - dashboard_response_received
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yodawy-dashboard-central-main
  cancel-in-progress: false

jobs:
  sync-tools-cache:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'tools_dashboard_sync_requested'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER: m-saleh-yodawy
      TOOLS_REPO: YODAWY_TOOLS_REPOSITORY
      DASHBOARD_REPO: YODAWY_DASHBOARD_REPOSITORY
      BRANCH: main
      REQUEST_ID: ${{ github.event.client_payload.requestId }}
      SEQUENCE: ${{ github.event.client_payload.sequence || '001' }}
      SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}

    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_DASHBOARD_REPOSITORY
          ref: main
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          path: dashboard
          fetch-depth: 1

      - name: Checkout Tools Repository
        uses: actions/checkout@v4
        with:
          repository: m-saleh-yodawy/YODAWY_TOOLS_REPOSITORY
          ref: main
          token: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}
          path: tools-source
          fetch-depth: 1

      - name: Validate Request and Synchronize Tools Cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          DASHBOARD = ROOT / "dashboard"
          SOURCE = ROOT / "tools-source"
          SOURCE_TOOLS = SOURCE / "TOOLS"
          CATALOG_FILE = SOURCE / "CONFIG" / "tools.json"
          CACHE_ROOT = DASHBOARD / "TOOLS_CACHE"
          CACHE_TOOLS = CACHE_ROOT / "TOOLS"
          MANIFEST_FILE = CACHE_ROOT / "tools-manifest.json"

          OWNER = os.environ["OWNER"]
          TOOLS_REPO = os.environ["TOOLS_REPO"]
          DASHBOARD_REPO = os.environ["DASHBOARD_REPO"]
          BRANCH = os.environ["BRANCH"]
          SEQ = os.environ.get("SEQUENCE", "001").strip() or "001"
          REQUEST_ID = os.environ.get("REQUEST_ID", "").strip()
          TOKEN = os.environ["SYNC_TOKEN"].strip()

          REQ_FILE = DASHBOARD / "NETWORK" / f"dashboard-request-{SEQ}.json"
          LEGACY_REQ_FILE = SOURCE / "NETWORK" / "tools-dashboard-request.json"
          RECEIPT_FILE = DASHBOARD / "NETWORK" / f"tools-request-receiptor-{SEQ}.json"
          LEGACY_RECEIPT_FILE = DASHBOARD / "NETWORK" / "tools-dashboard-request-receiptor.json"
          RESP_FILE = DASHBOARD / "NETWORK" / f"tools-response-{SEQ}.json"
          LEGACY_RESP_FILE = DASHBOARD / "NETWORK" / "tools-dashboard-response.json"

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              tmp.replace(path)

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8-sig"))

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1048576), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def read_meta(text, field):
              m = re.search(r"(?im)^\s*//\s*@" + re.escape(field) + r"\s+(.+?)\s*$", text)
              return m.group(1).strip() if m else ""

          req_data = read_json(REQ_FILE) if REQ_FILE.is_file() else read_json(LEGACY_REQ_FILE)
          if not REQUEST_ID:
              REQUEST_ID = str(req_data.get("requestId", "")).strip()
          if not REQUEST_ID or req_data.get("requestId") != REQUEST_ID:
              raise RuntimeError("Invalid or mismatched requestId for tools cache sync")

          summary = {"activeTools": 0, "copiedFiles": 0, "manifestPath": "TOOLS_CACHE/tools-manifest.json"}

          try:
              catalog = read_json(CATALOG_FILE)
              catalog_tools = catalog.get("tools", [])
              catalog_by_path = {}
              for item in catalog_tools:
                  t_path = str(item.get("path", "")).replace("\\", "/").strip()
                  if t_path.startswith("TOOLS/") and t_path.casefold().endswith(".js") and not t_path.casefold().endswith(".min.js"):
                      catalog_by_path[t_path.casefold()] = item

              source_files = sorted(
                  (p for p in SOURCE_TOOLS.rglob("*") if p.is_file() and p.suffix.casefold() == ".js" and not p.name.casefold().endswith(".min.js")),
                  key=lambda p: p.as_posix().casefold(),
              )
              source_by_path = {}
              for sf in source_files:
                  rel = sf.relative_to(SOURCE).as_posix()
                  key = rel.casefold()
                  if key not in catalog_by_path:
                      raise RuntimeError(f"Unregistered JS file: {rel}")
                  source_by_path[key] = sf

              active_tools = []
              for key, item in catalog_by_path.items():
                  if str(item.get("status", "")).strip().casefold() == "active":
                      if key not in source_by_path:
                          raise RuntimeError(f"Missing active tool file: {item.get('path')}")
                      active_tools.append((key, item, source_by_path[key]))

              if not active_tools:
                  raise RuntimeError("No active JavaScript tools found")

              manifest_tools = []
              files_to_copy = []
              for _, item, sf in active_tools:
                  text = sf.read_text(encoding="utf-8", errors="replace")
                  rel = sf.relative_to(SOURCE_TOOLS).as_posix()
                  cached_path = (Path("TOOLS_CACHE") / "TOOLS" / rel).as_posix()
                  manifest_tools.append({
                      "id": str(item.get("id", "")).strip(),
                      "name": str(item.get("name", "")).strip() or read_meta(text, "name") or sf.stem,
                      "description": str(item.get("description", "")).strip() or read_meta(text, "description"),
                      "version": str(item.get("version", "")).strip() or read_meta(text, "version"),
                      "author": read_meta(text, "author"),
                      "path": cached_path,
                      "file": sf.name,
                      "sha256": sha256_file(sf),
                  })
                  files_to_copy.append((sf, rel))

              CACHE_ROOT.mkdir(parents=True, exist_ok=True)
              tmp_cache = CACHE_ROOT / "TOOLS.tmp"
              old_cache = CACHE_ROOT / "TOOLS.old"
              if tmp_cache.exists():
                  shutil.rmtree(tmp_cache)
              tmp_cache.mkdir(parents=True, exist_ok=True)

              for sf, rel in files_to_copy:
                  dest = tmp_cache / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(sf, dest)

              manifest = {
                  "repository": f"{OWNER}/{TOOLS_REPO}",
                  "branch": BRANCH,
                  "sourceCatalog": "CONFIG/tools.json",
                  "tools": manifest_tools,
              }
              write_json(MANIFEST_FILE, manifest)

              if old_cache.exists():
                  shutil.rmtree(old_cache)
              if CACHE_TOOLS.exists():
                  CACHE_TOOLS.rename(old_cache)
              tmp_cache.rename(CACHE_TOOLS)
              if old_cache.exists():
                  shutil.rmtree(old_cache)

              summary["activeTools"] = len(manifest_tools)
              summary["copiedFiles"] = len(files_to_copy)
              status_val = "COMPLETED"
              msg = "Tools synchronization completed successfully."
          except Exception as err:
              status_val = "FAILED"
              msg = str(err)
              raise
          finally:
              ts = utc_now()
              receipt_payload = {
                  "protocolVersion": 1,
                  "requestId": REQUEST_ID,
                  "sequence": SEQ,
                  "requestType": "TOOLS_DASHBOARD_SYNC",
                  "status": status_val,
                  "updatedAt": ts,
                  "source": {"owner": OWNER, "repository": TOOLS_REPO, "branch": BRANCH},
                  "destination": {"owner": OWNER, "repository": DASHBOARD_REPO, "branch": BRANCH},
                  "message": msg,
                  "summary": summary,
              }
              response_payload = {
                  "protocolVersion": 1,
                  "requestId": REQUEST_ID,
                  "sequence": SEQ,
                  "requestType": "TOOLS_DASHBOARD_SYNC",
                  "status": status_val,
                  "completedAt": ts,
                  "source": {"owner": OWNER, "repository": DASHBOARD_REPO, "branch": BRANCH},
                  "destination": {"owner": OWNER, "repository": TOOLS_REPO, "branch": BRANCH},
                  "message": msg,
                  "summary": summary,
              }
              write_json(RECEIPT_FILE, receipt_payload)
              write_json(LEGACY_RECEIPT_FILE, receipt_payload)
              write_json(RESP_FILE, response_payload)
              write_json(LEGACY_RESP_FILE, response_payload)
          PY

      - name: Commit Dashboard Tools Sync Result
        if: always()
        working-directory: dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A TOOLS_CACHE NETWORK
          if ! git diff --cached --quiet; then
            git commit -m "Sync Dashboard tools cache and manifest [skip ci]"
            git push origin HEAD:main
          fi

  process-dashboard-responses:
    if: github.event_name != 'repository_dispatch' || github.event.action == 'dashboard_response_received'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OWNER: m-saleh-yodawy
      DASHBOARD_REPO: YODAWY_DASHBOARD_REPOSITORY
      USERS_REPO: YODAWY_USERS_REPOSITORY
      BRANCH: main
      SYNC_TOKEN: ${{ secrets.YODAWY_REPOSITORIES_SYNC_TOKEN }}

    steps:
      - name: Checkout Dashboard Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Process Responses and Reconcile Dashboard Configs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          NETWORK = Path("NETWORK")
          USERS_PATH = Path("CONFIG/auth-users.json")
          PERMISSIONS_PATH = Path("CONFIG/tools-permissions.json")
          VISIBILITY_PATH = Path("CONFIG/tools-visibility.json")
          MANIFEST_PATH = Path("TOOLS_CACHE/tools-manifest.json")
          PROCESSED_PATH = NETWORK / "processed-transactions.json"

          def utc_now():
              return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          def read_json(path, default):
              if not path.is_file():
                  return default
              raw = path.read_text(encoding="utf-8-sig").strip()
              return json.loads(raw) if raw else default

          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              out = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              old = path.read_text(encoding="utf-8-sig") if path.is_file() else ""
              if old != out:
                  path.write_text(out, encoding="utf-8")

          def norm_id(val):
              return str(val or "").strip().upper()

          def norm_role(val):
              r = re.sub(r"[\s_-]+", "_", str(val or "USER").strip().upper())
              if r == "SUPERADMIN":
                  r = "SUPER_ADMIN"
              return r if r in {"SUPER_ADMIN", "ADMIN", "USER"} else "USER"

          def merge_users(existing, incoming):
              result = list(existing)
              idx_map = {}
              for i, u in enumerate(result):
                  if isinstance(u, dict) and norm_id(u.get("id")):
                      idx_map[norm_id(u.get("id"))] = i
              for inc in incoming:
                  if not isinstance(inc, dict):
                      continue
                  uid = norm_id(inc.get("id"))
                  if not uid:
                      continue
                  if uid in idx_map:
                      merged = dict(result[idx_map[uid]])
                      merged.update(inc)
                      result[idx_map[uid]] = merged
                  else:
                      idx_map[uid] = len(result)
                      result.append(dict(inc))
              return result

          processed = read_json(PROCESSED_PATH, {"completedRequestIds": []})
          completed_ids = set(processed.get("completedRequestIds", []))

          users_data = read_json(USERS_PATH, {"users": []})
          users = users_data.get("users", []) if isinstance(users_data, dict) else []
          permissions = read_json(PERMISSIONS_PATH, {})
          visibility = read_json(VISIBILITY_PATH, {})

          NETWORK.mkdir(parents=True, exist_ok=True)
          response_files = sorted(NETWORK.glob("dashboard-response*.json"))
          legacy_resp = NETWORK / "user-response.json"
          if legacy_resp.is_file():
              response_files.append(legacy_resp)

          for resp_file in response_files:
              resp = read_json(resp_file, {})
              if not isinstance(resp, dict) or not resp:
                  continue

              req_id = str(resp.get("requestId") or resp.get("request_id") or "").strip()
              status = str(resp.get("status") or "").strip().upper()
              if not req_id or req_id in completed_ids:
                  if req_id in completed_ids:
                      resp_file.unlink(missing_ok=True)
                  continue

              seq_match = re.search(r"-(\d{3,})\.json$", resp_file.name)
              seq = str(resp.get("sequence") or (seq_match.group(1) if seq_match else "001")).strip()

              source_info = resp.get("sourceInfo") or resp.get("source") or {}
              source_repo = source_info.get("repository", "") if isinstance(source_info, dict) else str(source_info)
              req_type = str(resp.get("requestType") or "").strip().upper()

              if "USERS" in source_repo.upper() or req_type in {"DASHBOARD_USERS_SYNC", "USERS_DASHBOARD_SYNC", "SYNC_USERS"}:
                  receipt_file = NETWORK / f"users-response-receiptor-{seq}.json"
                  req_file = NETWORK / f"users-request-{seq}.json"
                  if receipt_file.is_file():
                      rec = read_json(receipt_file, {})
                      rec_id = str(rec.get("requestId") or rec.get("request_id") or "").strip()
                      if rec_id and rec_id != req_id:
                          raise RuntimeError(f"Receipt requestId mismatch for {req_id}")
                  if req_file.is_file():
                      orig_req = read_json(req_file, {})
                      orig_id = str(orig_req.get("requestId") or orig_req.get("request_id") or "").strip()
                      if orig_id and orig_id != req_id:
                          raise RuntimeError(f"Original requestId mismatch for {req_id}")

                  if status in {"SUCCESS", "COMPLETED"}:
                      inc_users = resp.get("users")
                      if isinstance(inc_users, list):
                          users = merge_users(users, inc_users)
                      elif isinstance(resp.get("user"), dict):
                          users = merge_users(users, [resp["user"]])
                      if isinstance(resp.get("permissions"), dict):
                          permissions.update(resp["permissions"])
                      if isinstance(resp.get("visibility"), dict):
                          visibility.update(resp["visibility"])

                  completed_ids.add(req_id)
                  resp_file.unlink(missing_ok=True)
                  if receipt_file.is_file():
                      receipt_file.unlink(missing_ok=True)
                  if req_file.is_file():
                      req_file.unlink(missing_ok=True)

              elif req_type == "DASHBOARD_PERSONAL_SYNC":
                  receipt_file = NETWORK / f"personal-response-receiptor-{seq}.json"
                  req_file = NETWORK / f"personal-request-{seq}.json"
                  if req_file.is_file():
                      orig_req = read_json(req_file, {})
                      if str(orig_req.get("requestId", "")).strip() != req_id:
                          raise RuntimeError(f"Personal response requestId mismatch for {req_id}")
                  if receipt_file.is_file():
                      rec = read_json(receipt_file, {})
                      if str(rec.get("requestId", "")).strip() != req_id:
                          raise RuntimeError(f"Personal receipt requestId mismatch for {req_id}")

                  completed_ids.add(req_id)
                  resp_file.unlink(missing_ok=True)
                  if receipt_file.is_file():
                      receipt_file.unlink(missing_ok=True)
                  if req_file.is_file():
                      req_file.unlink(missing_ok=True)

          users_data["users"] = users
          write_json(USERS_PATH, users_data)

          active_ids = {
              norm_id(u.get("id"))
              for u in users
              if isinstance(u, dict) and norm_id(u.get("id")) and str(u.get("status", "Active")).strip().casefold() == "active"
          }

          manifest = read_json(MANIFEST_PATH, {})
          tools_list = manifest.get("tools", []) if isinstance(manifest, dict) else (manifest if isinstance(manifest, list) else [])
          tool_ids = []
          for t in tools_list:
              if isinstance(t, dict):
                  tid = str(t.get("id") or t.get("toolId") or "").strip()
                  if tid and tid not in tool_ids:
                      tool_ids.append(tid)
          for tid in list(visibility.keys()):
              if tid not in tool_ids:
                  tool_ids.append(tid)

          for u in users:
              if not isinstance(u, dict):
                  continue
              uid = norm_id(u.get("id"))
              if not uid or uid not in active_ids:
                  continue
              role = norm_role(u.get("role") or u.get("ROLE"))
              u_perms = permissions.setdefault(uid, {})
              for tid in tool_ids:
                  cur = u_perms.get(tid)
                  if not isinstance(cur, dict):
                      u_perms[tid] = {"granted": role == "SUPER_ADMIN", "type": role}
                  else:
                      cur["granted"] = bool(cur.get("granted", role == "SUPER_ADMIN"))
                      cur["type"] = role

          for tid in tool_ids:
              ex = visibility.get(tid)
              if not isinstance(ex, dict):
                  visibility[tid] = {
                      "visibility": "SUPER_ADMIN",
                      "allowedUsers": [],
                      "developmentStatus": "UNDER DEVELOPMENT",
                      "publicationStatus": "NOT PUBLISHED",
                      "enabled": False,
                  }
              else:
                  ex.setdefault("visibility", "SUPER_ADMIN")
                  allowed = ex.get("allowedUsers", [])
                  ex["allowedUsers"] = list(dict.fromkeys(norm_id(uid) for uid in (allowed if isinstance(allowed, list) else []) if norm_id(uid) in active_ids))
                  ex.setdefault("developmentStatus", "UNDER DEVELOPMENT")
                  ex.setdefault("publicationStatus", "NOT PUBLISHED")
                  ex.setdefault("enabled", False)

          write_json(PERMISSIONS_PATH, permissions)
          write_json(VISIBILITY_PATH, visibility)
          processed["completedRequestIds"] = sorted(completed_ids)[-500:]
          processed["updatedAt"] = utc_now()
          write_json(PROCESSED_PATH, processed)
          PY

      - name: Commit Synchronized Dashboard Data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CONFIG NETWORK
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize dashboard data [skip ci]"
            git push origin HEAD:main
          fi
